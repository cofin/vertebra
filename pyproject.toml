[build-system]
requires = ["maturin>=1.5,<2"]
build-backend = "maturin"

[project]
name = "vertebra"
version = "0.1.0"
description = "Python-first application backbone with Rust IPC primitives"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "anyio>=4.0",
    "msgspec>=0.18",
    "rich>=13.0",
    "rich-click>=1.7",
]

[project.scripts]
vtb = "vertebra.cli:cli"

[project.entry-points."sqlalchemy.dialects"]
"postgresql.vertebra" = "vertebra.extensions.sqlalchemy.dialects:PostgresVtbDialect"
"postgresql.vtb" = "vertebra.extensions.sqlalchemy.dialects:PostgresVtbDialect"
"oracle.vertebra" = "vertebra.extensions.sqlalchemy.dialects:OracleVtbDialect"
"oracle.vtb" = "vertebra.extensions.sqlalchemy.dialects:OracleVtbDialect"
"mysql.vertebra" = "vertebra.extensions.sqlalchemy.dialects:MysqlVtbDialect"
"mysql.vtb" = "vertebra.extensions.sqlalchemy.dialects:MysqlVtbDialect"
"sqlite.vertebra" = "vertebra.extensions.sqlalchemy.dialects:SqliteVtbDialect"
"sqlite.vtb" = "vertebra.extensions.sqlalchemy.dialects:SqliteVtbDialect"

[project.optional-dependencies]
framework = [
    "msgspec>=0.18",
]
sqlspec = [
    "sqlspec>=0.68.0",
]
dev = [
    "pytest>=8.0",
    "pytest-anyio>=0.0.0",
    "ruff>=0.4",
    "mypy>=1.10",
]

[dependency-groups]
dev = [
    { include-group = "test" },
    { include-group = "lint" },
    { include-group = "build" },
]
test = [
    "pytest",
    "pytest-cov>=5.0",
    "anyio",
]
lint = [
    "ruff",
    "mypy",
]
build = [
"maturin>=1.5,<2"
]
bench = [
    "duckdb>=1.0",
    "uvicorn[standard]>=0.30",
    "httptools>=0.6",
    "uvloop>=0.21",
    "granian>=1.6",
    "spikard>=0.12",
]

[tool.maturin]
python-source = "src/py"
module-name = "vertebra._vertebra"
manifest-path = "src/rs/vertebra-py/Cargo.toml"
features = ["extension-module"]

[tool.ruff]
line-length = 120
target-version = "py312"
src = ["src/py"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["vertebra"]

[tool.pytest.ini_options]
testpaths = ["src/py/tests"]
pythonpath = ["."]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src/py/vertebra", "tools/scripts", "tools/pgo"]

[[tool.mypy.overrides]]
module = [
    "pydantic.*",
    "orjson",
    "attrs",
    "numpy",
    "numpy.*",
    "pyarrow",
    "pyarrow.*",
    "uvloop",
    "fastapi",
    "fastapi.*",
    "litestar",
    "litestar.*",
    "sqlspec",
    "sqlspec.*",
    "django.*",
    "concurrent.interpreters",
]
ignore_missing_imports = true

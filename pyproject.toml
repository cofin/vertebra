[build-system]
requires = ["maturin>=1.5,<2"]
build-backend = "maturin"

[project]
name = "vertebra-core"
version = "0.2.0"
description = "One runtime for Python and TypeScript — backend, frontend, web, gRPC, workers, and standalone apps."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "anyio>=4.0",
    "msgspec>=0.18",
    "rich>=13.0",
    "rich-click>=1.7",
]

[project.scripts]
vtb = "vertebra.cli:cli"

[project.entry-points."sqlalchemy.dialects"]
"postgresql.vertebra" = "vertebra.extensions.sqlalchemy.dialects:PostgreSQLDialect"
"postgresql.vtb" = "vertebra.extensions.sqlalchemy.dialects:PostgreSQLDialect"
"postgresql.vertebra_async" = "vertebra.extensions.sqlalchemy.dialects:PostgreSQLAsyncDialect"
"postgresql.vtb_async" = "vertebra.extensions.sqlalchemy.dialects:PostgreSQLAsyncDialect"
"oracle.vertebra" = "vertebra.extensions.sqlalchemy.dialects:OracleDialect"
"oracle.vtb" = "vertebra.extensions.sqlalchemy.dialects:OracleDialect"
"oracle.vertebra_async" = "vertebra.extensions.sqlalchemy.dialects:OracleAsyncDialect"
"oracle.vtb_async" = "vertebra.extensions.sqlalchemy.dialects:OracleAsyncDialect"
"mysql.vertebra" = "vertebra.extensions.sqlalchemy.dialects:MySQLDialect"
"mysql.vtb" = "vertebra.extensions.sqlalchemy.dialects:MySQLDialect"
"mysql.vertebra_async" = "vertebra.extensions.sqlalchemy.dialects:MySQLAsyncDialect"
"mysql.vtb_async" = "vertebra.extensions.sqlalchemy.dialects:MySQLAsyncDialect"
"sqlite.vertebra" = "vertebra.extensions.sqlalchemy.dialects:SQLiteDialect"
"sqlite.vtb" = "vertebra.extensions.sqlalchemy.dialects:SQLiteDialect"
"sqlite.vertebra_async" = "vertebra.extensions.sqlalchemy.dialects:SQLiteAsyncDialect"
"sqlite.vtb_async" = "vertebra.extensions.sqlalchemy.dialects:SQLiteAsyncDialect"
"mssql.vertebra" = "vertebra.extensions.sqlalchemy.dialects:MSSQLDialect"
"mssql.vtb" = "vertebra.extensions.sqlalchemy.dialects:MSSQLDialect"
"mssql.vertebra_async" = "vertebra.extensions.sqlalchemy.dialects:MSSQLAsyncDialect"
"mssql.vtb_async" = "vertebra.extensions.sqlalchemy.dialects:MSSQLAsyncDialect"
"duckdb.vertebra" = "vertebra.extensions.sqlalchemy.dialects:DuckDBDialect"
"duckdb.vtb" = "vertebra.extensions.sqlalchemy.dialects:DuckDBDialect"
"duckdb.vertebra_async" = "vertebra.extensions.sqlalchemy.dialects:DuckDBAsyncDialect"
"duckdb.vtb_async" = "vertebra.extensions.sqlalchemy.dialects:DuckDBAsyncDialect"

[project.optional-dependencies]
framework = [
    "msgspec>=0.18",
]
sqlspec = [
    "sqlspec>=0.69.0",
]
alchemy = [
    "advanced-alchemy>=1.12.0",
    "sqlalchemy>=2.0.36",
    "alembic>=1.14.0",
]
arrow = [
    "pyarrow>=18.0.0",
]
pydantic = [
    "pydantic>=2.9.0",
]
attrs = [
    "attrs>=24.0.0",
]
polars = [
    "polars>=1.0.0",
]
litestar = [
    "litestar>=2.15.0",
]
starlette = [
    "starlette>=0.40.0",
]
fastapi = [
    "fastapi>=0.115.0",
    "pydantic>=2.9.0",
]
flask = [
    "flask>=3.0.0",
]
django = [
    "django>=5.1.0",
]
queues = [
    "litestar-queues>=0.12.0",
]
security = [
    "litestar-security>=0.6.0",
]
autowire = [
    "litestar-autowire>=0.2.0",
]
email = [
    "litestar-email>=0.4.0",
]
mcp = [
    "litestar-mcp>=0.16.0",
]
vite = [
    "litestar-vite>=0.32.0",
]
asyncapi = [
    "litestar-asyncapi>=0.2.0",
]
htmx = [
    "litestar-htmx>=0.5.0",
]
saq = [
    "litestar-saq>=0.8.0",
]
all = [
    "sqlspec>=0.69.0",
    "advanced-alchemy>=1.12.0",
    "sqlalchemy>=2.0.36",
    "alembic>=1.14.0",
    "pyarrow>=18.0.0",
    "pydantic>=2.9.0",
    "attrs>=24.0.0",
    "polars>=1.0.0",
    "litestar>=2.15.0",
    "starlette>=0.40.0",
    "fastapi>=0.115.0",
    "flask>=3.0.0",
    "django>=5.1.0",
    "litestar-queues>=0.12.0",
    "litestar-security>=0.6.0",
    "litestar-autowire>=0.2.0",
    "litestar-email>=0.4.0",
    "litestar-mcp>=0.16.0",
    "litestar-vite>=0.32.0",
    "litestar-asyncapi>=0.2.0",
    "litestar-htmx>=0.5.0",
    "litestar-saq>=0.8.0",
]

[dependency-groups]
dev = [
    { include-group = "test" },
    { include-group = "lint" },
    { include-group = "build" },
]
doc = [
    "anyio>=4.0",
    "mkdocstrings-python>=2.0.3",
    "msgspec>=0.18",
    "pymdown-extensions>=10.16",
    "rich>=13.0",
    "rich-click>=1.7",
    "ruff>=0.4",
    "zensical>=0.0.71",
]
test = [
    "pytest",
    "pytest-cov>=5.0",
    "pytest-databases>=0.19.0",
    "pytest-xdist>=3.6.1",
    "anyio",
    "sqlspec>=0.69.0",
    "advanced-alchemy>=1.12.0",
    "sqlalchemy>=2.0.36",
    "alembic>=1.14.0",
    "pyarrow>=18.0.0",
    "pydantic>=2.9.0",
    "attrs>=24.0.0",
    "litestar>=2.15.0",
    "starlette>=0.40.0",
    "fastapi>=0.115.0",
    "flask>=3.0.0",
    "django>=5.1.0",
    "litestar-queues>=0.12.0",
    "litestar-security>=0.6.0",
    "litestar-autowire>=0.2.0",
    "litestar-email>=0.4.0",
    "litestar-mcp>=0.16.0",
    "litestar-vite>=0.32.0",
    "litestar-asyncapi>=0.2.0",
    "litestar-htmx>=0.5.0",
    "litestar-saq>=0.8.0",
]
lint = [
    "ruff",
    "mypy",
]
build = [
    "bump-my-version>=0.31.1",
    "maturin>=1.5,<2",
]
bench = [
    "duckdb>=1.0",
    "uvicorn[standard]>=0.30",
    "httptools>=0.6",
    "uvloop>=0.21",
    "granian>=1.6",
    "spikard>=0.12",
]

[tool.uv.sources]
pytest-databases = { git = "https://github.com/litestar-org/pytest-databases.git", branch = "test/clientless-all" }

[tool.maturin]
python-source = "src/py"
python-packages = ["vertebra"]
module-name = "vertebra._vertebra"
manifest-path = "src/rs/vertebra-py/Cargo.toml"
features = ["extension-module"]
include = [
    { path = "src/rs/Cargo.toml", format = "sdist" },
    { path = "src/rs/Cargo.lock", format = "sdist" },
    { path = "src/rs/vertebra-*/**/*", format = "sdist" },
    { path = "src/py/vertebra/server/_js/bundle/**/*", format = ["sdist", "wheel"] },
]

[tool.ruff]
line-length = 120
target-version = "py312"
src = ["src/py", "docs/examples", "tools"]

[tool.ruff.format]
docstring-code-format = true
docstring-code-line-length = 60
exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["vertebra"]

[tool.pytest.ini_options]
testpaths = ["src/py/tests"]
pythonpath = [".", "src/py"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = ["src/py"]
files = ["src/py/vertebra", "tools/scripts", "tools/pgo", "tools/docs", "docs/examples"]

[[tool.mypy.overrides]]
module = [
    "pydantic.*",
    "attrs",
    "numpy",
    "numpy.*",
    "pyarrow",
    "pyarrow.*",
    "polars",
    "polars.*",
    "uvloop",
    "starlette",
    "starlette.*",
    "fastapi",
    "fastapi.*",
    "flask",
    "flask.*",
    "litestar",
    "litestar.*",
    "litestar_queues",
    "litestar_queues.*",
    "litestar_security",
    "litestar_security.*",
    "litestar_autowire",
    "litestar_autowire.*",
    "litestar_email",
    "litestar_email.*",
    "litestar_mcp",
    "litestar_mcp.*",
    "litestar_vite",
    "litestar_vite.*",
    "litestar_asyncapi",
    "litestar_asyncapi.*",
    "litestar_htmx",
    "litestar_htmx.*",
    "litestar_saq",
    "litestar_saq.*",
    "advanced_alchemy",
    "advanced_alchemy.*",
    "sqlalchemy",
    "sqlalchemy.*",
    "alembic",
    "alembic.*",
    "sqlspec",
    "sqlspec.*",
    "django",
    "django.*",
    "pytest_databases",
    "pytest_databases.*",
    "concurrent.interpreters",
]
ignore_missing_imports = true

[tool.bumpversion]
allow_dirty = true
commit = false
commit_args = "--no-verify"
current_version = "0.2.0"
ignore_missing_files = false
ignore_missing_version = false
message = "chore(release): bump to v{new_version}"
parse = """(?x)
    (?P<major>\\d+)\\.(?P<minor>\\d+)\\.(?P<patch>\\d+)
    (-(?P<pre>alpha|beta|rc)\\.(?P<pre_n>\\d+))?
"""
regex = false
replace = "{new_version}"
search = "{current_version}"
serialize = ["{major}.{minor}.{patch}", "{major}.{minor}.{patch}-{pre}.{pre_n}"]
sign_tags = false
tag = false
tag_message = "chore(release): v{new_version}"
tag_name = "v{new_version}"

[tool.bumpversion.parts.pre]
first_value = "stable"
optional_value = "stable"
values = ["alpha", "beta", "rc", "stable"]

[tool.bumpversion.parts.pre_n]
first_value = "1"

[[tool.bumpversion.files]]
filename = "pyproject.toml"

[[tool.bumpversion.files]]
filename = "src/py/vertebra/__init__.py"
search = '__version__ = "{current_version}"'
replace = '__version__ = "{new_version}"'

[[tool.bumpversion.files]]
filename = "src/rs/Cargo.toml"
search = 'version = "{current_version}"'
replace = 'version = "{new_version}"'

[[tool.bumpversion.files]]
filename = "src/rs/vertebra-bundler/pyproject.toml"
search = 'version = "{current_version}"'
replace = 'version = "{new_version}"'

[[tool.bumpversion.files]]
filename = "src/rs/vertebra-storage/pyproject.toml"
search = 'version = "{current_version}"'
replace = 'version = "{new_version}"'

[[tool.bumpversion.files]]
filename = "src/ts/vertebra-client/package.json"
search = '"version": "{current_version}"'
replace = '"version": "{new_version}"'

[tool.uv.sources]
vertebra-bigquery = { path = "src/rs/vertebra-bigquery", editable = true }
vertebra-bundler = { path = "src/rs/vertebra-bundler", editable = true }
vertebra-duckdb = { path = "src/rs/vertebra-duckdb", editable = true }
vertebra-mssql = { path = "src/rs/vertebra-mssql", editable = true }
vertebra-mysql = { path = "src/rs/vertebra-mysql", editable = true }
vertebra-oracle = { path = "src/rs/vertebra-oracle", editable = true }
vertebra-postgres = { path = "src/rs/vertebra-postgres", editable = true }
vertebra-spanner = { path = "src/rs/vertebra-spanner", editable = true }
vertebra-storage = { path = "src/rs/vertebra-storage", editable = true }

[tool.maturin]
python-source = "src/py"
python-packages = ["vertebra"]
module-name = "vertebra._vertebra"
manifest-path = "src/rs/vertebra-py/Cargo.toml"
features = ["extension-module"]
include = [
    { path = "src/rs/Cargo.toml", format = "sdist" },
    { path = "src/rs/Cargo.lock", format = "sdist" },
    { path = "src/rs/vertebra-*/**/*", format = "sdist" },
    { path = "src/py/vertebra/server/_js/bundle/**/*", format = ["sdist", "wheel"] },
    { path = "src/py/vertebra/framework/assets/*", format = ["sdist", "wheel"] },
    { path = "src/py/vertebra/bin/*", format = "wheel" },
]
exclude = [
    { path = "src/py/vertebra/*.so", format = ["sdist", "wheel"] },
    { path = "src/py/vertebra/*.pyd", format = ["sdist", "wheel"] },
    { path = "src/py/vertebra/*.dylib", format = ["sdist", "wheel"] },
    { path = "src/py/vertebra/_bigquery.pyi", format = "wheel" },
    { path = "src/py/vertebra/_bundler.pyi", format = "wheel" },
    { path = "src/py/vertebra/_duckdb.pyi", format = "wheel" },
    { path = "src/py/vertebra/_mssql.pyi", format = "wheel" },
    { path = "src/py/vertebra/_mysql.pyi", format = "wheel" },
    { path = "src/py/vertebra/_oracle.pyi", format = "wheel" },
    { path = "src/py/vertebra/_postgres.pyi", format = "wheel" },
    { path = "src/py/vertebra/_spanner.pyi", format = "wheel" },
    { path = "src/py/vertebra/_storage.pyi", format = "wheel" },
]

[tool.ruff]
line-length = 120
target-version = "py312"
src = ["src/py", "docs/examples", "tools"]

[tool.ruff.format]
docstring-code-format = true
docstring-code-line-length = 60
exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["vertebra"]

[tool.pytest.ini_options]
testpaths = ["src/py/tests"]
pythonpath = [".", "src/py"]

[tool.coverage.report]
ignore_errors = true

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = ["src/py"]
files = ["src/py/vertebra", "tools/scripts", "tools/pgo", "tools/docs", "docs/examples"]

[[tool.mypy.overrides]]
module = [
    "pydantic.*",
    "attrs",
    "numpy",
    "numpy.*",
    "pyarrow",
    "pyarrow.*",
    "polars",
    "polars.*",
    "uvloop",
    "winloop",
    "rloop",
    "starlette",
    "starlette.*",
    "fastapi",
    "fastapi.*",
    "flask",
    "flask.*",
    "litestar",
    "litestar.*",
    "litestar_queues",
    "litestar_queues.*",
    "litestar_security",
    "litestar_security.*",
    "litestar_autowire",
    "litestar_autowire.*",
    "litestar_email",
    "litestar_email.*",
    "litestar_mcp",
    "litestar_mcp.*",
    "litestar_vite",
    "litestar_vite.*",
    "litestar_asyncapi",
    "litestar_asyncapi.*",
    "litestar_htmx",
    "litestar_htmx.*",
    "litestar_saq",
    "litestar_saq.*",
    "advanced_alchemy",
    "advanced_alchemy.*",
    "sqlalchemy",
    "sqlalchemy.*",
    "alembic",
    "alembic.*",
    "sqlspec",
    "sqlspec.*",
    "django",
    "django.*",
    "pytest_databases",
    "pytest_databases.*",
    "concurrent.interpreters",
]
ignore_missing_imports = true

[tool.bumpversion]
allow_dirty = true
commit = false
commit_args = "--no-verify"
current_version = "0.3.0"
ignore_missing_files = false
ignore_missing_version = false
message = "chore(release): bump to v{new_version}"
parse = """(?x)
    (?P<major>\\d+)\\.(?P<minor>\\d+)\\.(?P<patch>\\d+)
    (-(?P<pre>alpha|beta|rc)\\.(?P<pre_n>\\d+))?
"""
regex = false
replace = "{new_version}"
search = "{current_version}"
serialize = ["{major}.{minor}.{patch}", "{major}.{minor}.{patch}-{pre}.{pre_n}"]
sign_tags = false
tag = false
tag_message = "chore(release): v{new_version}"
tag_name = "v{new_version}"

[tool.bumpversion.parts.pre]
first_value = "stable"
optional_value = "stable"
values = ["alpha", "beta", "rc", "stable"]

[tool.bumpversion.parts.pre_n]
first_value = "1"

[[tool.bumpversion.files]]
filename = "pyproject.toml"
search = 'version = "{current_version}"'
replace = 'version = "{new_version}"'

[[tool.bumpversion.files]]
filename = "pyproject.toml"
search = 'vertebra-bigquery=={current_version}'
replace = 'vertebra-bigquery=={new_version}'


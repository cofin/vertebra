name: Release

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate_release_manifest:
    name: Validate release manifest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          python-version: "3.12"
      - name: Reject upstream git pins in pyproject.toml
        run: |
          uv run --no-project --python 3.12 python - <<'PY'
          import sys
          import tomllib
          from pathlib import Path

          data = tomllib.loads(Path("pyproject.toml").read_text(encoding="utf-8"))
          sources = data.get("tool", {}).get("uv", {}).get("sources", {})
          git_keys = {"git", "rev", "branch", "tag"}
          pinned: list[str] = []
          for name, spec in sources.items():
              entries = spec if isinstance(spec, list) else [spec]
              if any(isinstance(entry, dict) and any(key in entry for key in git_keys) for entry in entries):
                  pinned.append(name)
          if pinned:
              print(f"Release blocked: [tool.uv.sources] contains upstream git pins: {pinned}", file=sys.stderr)
              sys.exit(1)
          PY

  build_wheels:
    name: Build ${{ matrix.package.name }} on ${{ matrix.platform.os }} (${{ matrix.platform.arch }})
    needs: validate_release_manifest
    runs-on: ${{ matrix.platform.os }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - os: ubuntu-latest
            arch: x86_64
          - os: ubuntu-24.04-arm
            arch: aarch64
          - os: macos-latest
            arch: "x86_64 arm64"
          - os: windows-latest
            arch: AMD64
        package:
          - name: core
            path: .
            module: vertebra._vertebra
            exports: ArrowCursor DatabaseError
          - name: bigquery
            path: src/rs/vertebra-bigquery
            module: vertebra._bigquery
            exports: SyncBigQueryClient AsyncBigQueryClient
          - name: bundler
            path: src/rs/vertebra-bundler
            module: vertebra._bundler
            exports: Bundler BundleConfig minify_css
          - name: duckdb
            path: src/rs/vertebra-duckdb
            module: vertebra._duckdb
            exports: SyncDuckDBClient AsyncDuckDBClient
          - name: mssql
            path: src/rs/vertebra-mssql
            module: vertebra._mssql
            exports: SyncMSSQLClient AsyncMSSQLClient
          - name: mysql
            path: src/rs/vertebra-mysql
            module: vertebra._mysql
            exports: SyncMySQLClient AsyncMySQLClient
          - name: oracle
            path: src/rs/vertebra-oracle
            module: vertebra._oracle
            exports: SyncOracleClient AsyncOracleClient SyncOraclePool AsyncOraclePool
          - name: postgres
            path: src/rs/vertebra-postgres
            module: vertebra._postgres
            exports: SyncPostgresClient AsyncPostgresClient SyncPostgresPool AsyncPostgresPool SyncPostgresPortal AsyncPostgresPortal SyncPostgresArrowStream AsyncPostgresArrowStream SyncPostgresCopyOut SyncPostgresCopyIn AsyncPostgresCopyOut AsyncPostgresCopyIn AsyncPostgresListener AsyncPostgresReplication
          - name: redis
            path: src/rs/vertebra-redis
            module: vertebra._redis
            exports: SyncRedisClient AsyncRedisClient SyncRedisPipeline AsyncRedisPipeline SyncRedisListener AsyncRedisListener
          - name: spanner
            path: src/rs/vertebra-spanner
            module: vertebra._spanner
            exports: SyncSpannerClient AsyncSpannerClient
          - name: sqlite
            path: src/rs/vertebra-sqlite
            module: vertebra._sqlite
            exports: SyncSQLiteClient AsyncSQLiteClient
          - name: storage
            path: src/rs/vertebra-storage
            module: vertebra._storage
            exports: SyncObjectStore AsyncObjectStore
          - name: valkey
            path: src/rs/vertebra-valkey
            module: vertebra._valkey
            exports: SyncValkeyClient AsyncValkeyClient SyncValkeyPipeline AsyncValkeyPipeline SyncValkeyListener AsyncValkeyListener

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ runner.os == 'macOS' && 'x86_64-apple-darwin,aarch64-apple-darwin' || '' }}

      - name: Install Bun
        if: matrix.package.name == 'core'
        uses: oven-sh/setup-bun@v2

      - name: Build TypeScript client bundle
        if: matrix.package.name == 'core'
        run: |
          cd src/ts/vertebra-client
          bun install
          bun run build

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Check Windows MSVC targets for postgres
        if: runner.os == 'Windows' && matrix.package.name == 'postgres'
        run: cargo check --manifest-path src/rs/Cargo.toml -p vertebra-db -p vertebra-postgres --all-targets

      - name: Build core wheel
        if: matrix.package.name == 'core'
        uses: pypa/cibuildwheel@v4.3.5
        with:
          package-dir: ${{ matrix.package.path }}
        env:
          CIBW_BUILD: "cp312-* cp313-* cp314-* cp314t-* cp315-* cp315t-*"
          CIBW_ARCHS_MACOS: ${{ matrix.platform.arch }}
          CIBW_ARCHS_LINUX: ${{ matrix.platform.arch }}
          CIBW_ARCHS_WINDOWS: ${{ matrix.platform.arch }}
          CIBW_BEFORE_ALL_LINUX: "curl https://sh.rustup.rs -sSf | sh -s -- -y"
          CIBW_ENVIRONMENT_LINUX: 'PATH="$HOME/.cargo/bin:$PATH"'
          CIBW_BEFORE_BUILD: "python {package}/tools/scripts/build_server_binary.py build --repo-root {package}"
          CIBW_REPAIR_WHEEL_COMMAND_LINUX: "python {package}/tools/scripts/build_server_binary.py repair --repo-root {package} -w {dest_dir} {wheel}"
          CIBW_REPAIR_WHEEL_COMMAND_MACOS: "python {package}/tools/scripts/build_server_binary.py repair --repo-root {package} -w {dest_dir} {wheel}"
          CIBW_TEST_COMMAND: >-
            python -I -c "import importlib; module = importlib.import_module('${{ matrix.package.module }}');
            assert all(hasattr(module, name) for name in '${{ matrix.package.exports }}'.split());
            print(module.__file__)"

      - name: Build wheels
        if: matrix.package.name != 'core'
        uses: pypa/cibuildwheel@v4.3.5
        with:
          package-dir: ${{ matrix.package.path }}
        env:
          CIBW_BUILD: "cp312-* cp313-* cp314-* cp314t-* cp315-* cp315t-*"
          CIBW_ARCHS_MACOS: ${{ matrix.platform.arch }}
          CIBW_ARCHS_LINUX: ${{ matrix.platform.arch }}
          CIBW_ARCHS_WINDOWS: ${{ matrix.platform.arch }}
          CIBW_BEFORE_ALL_LINUX: "curl https://sh.rustup.rs -sSf | sh -s -- -y"
          CIBW_ENVIRONMENT_LINUX: 'PATH="$HOME/.cargo/bin:$PATH"'
          CIBW_TEST_COMMAND: >-
            python -I -c "import importlib; module = importlib.import_module('${{ matrix.package.module }}');
            assert all(hasattr(module, name) for name in '${{ matrix.package.exports }}'.split());
            print(module.__file__)"

      - uses: actions/upload-artifact@v7
        with:
          name: cibw-wheels-${{ matrix.platform.os }}-${{ matrix.package.name }}-${{ strategy.job-index }}
          path: ./wheelhouse/*.whl
          if-no-files-found: error

  build_sdist:
    name: Build source distribution
    needs: validate_release_manifest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
      - name: Build TypeScript client bundle
        run: |
          cd src/ts/vertebra-client
          bun install
          bun run build
      - uses: astral-sh/setup-uv@v7
      - name: Build source distributions
        run: |
          uv build --sdist --out-dir dist
          for package in bigquery bundler duckdb mssql mysql oracle postgres redis spanner sqlite storage valkey; do
            uv build "src/rs/vertebra-$package" --sdist --out-dir dist
          done
      - uses: actions/upload-artifact@v7
        with:
          name: cibw-sdist
          path: dist/*.tar.gz
          if-no-files-found: error

  test_wheels:
    name: Smoke test core and optional wheels on ${{ matrix.os }}
    needs: [build_wheels, build_sdist]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - ubuntu-24.04-arm
          - macos-latest
          - windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          pattern: cibw-wheels-${{ matrix.os }}-*
          path: dist
          merge-multiple: true
      - uses: astral-sh/setup-uv@v7
      - name: Install core and optional wheels
        shell: bash
        run: |
          version=$(uv run --no-project --python 3.12 python -c "from pathlib import Path; print(next(Path('dist').glob('vertebra_core-*.whl')).name.split('-')[1])")
          uv venv --python 3.12 "$RUNNER_TEMP/wheel-smoke"
          py_bin="$RUNNER_TEMP/wheel-smoke/${{ runner.os == 'Windows' && 'Scripts/python.exe' || 'bin/python' }}"
          uv pip install --python "$py_bin" --no-index --no-deps --find-links "$GITHUB_WORKSPACE/dist" vertebra-core vertebra-bigquery vertebra-bundler vertebra-duckdb vertebra-mssql vertebra-mysql vertebra-oracle vertebra-postgres vertebra-redis vertebra-spanner vertebra-sqlite vertebra-storage vertebra-valkey
          uv pip install --python "$py_bin" --only-binary :all: --find-links "$GITHUB_WORKSPACE/dist" "vertebra-core[bigquery,bundler,duckdb,mssql,mysql,oracle,postgres,redis,spanner,sqlite,storage,valkey]==$version"
      - name: Smoke test wheel-installed vtb run
        shell: bash
        run: |
          vtb_bin="$RUNNER_TEMP/wheel-smoke/${{ runner.os == 'Windows' && 'Scripts/vtb.exe' || 'bin/vtb' }}"
          uv run --no-project --python 3.12 --with "msgspec>=0.18" python tools/scripts/smoke_vtb_run.py --vtb "$vtb_bin" --wheel-dir dist --workdir "$RUNNER_TEMP/vtb-smoke-app"
      - name: Check installed namespace and native exports
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        working-directory: ${{ runner.temp }}
        run: |
          "$RUNNER_TEMP/wheel-smoke/bin/python" -I - <<'PY'
          import importlib
          import importlib.metadata
          import pathlib
          import sys

          import vertebra
          from vertebra import _vertebra

          for name, exports in {
              "bigquery": ("SyncBigQueryClient", "AsyncBigQueryClient"),
              "bundler": ("Bundler", "BundleConfig", "minify_css"),
              "duckdb": ("SyncDuckDBClient", "AsyncDuckDBClient"),
              "mssql": ("SyncMSSQLClient", "AsyncMSSQLClient"),
              "mysql": ("SyncMySQLClient", "AsyncMySQLClient"),
              "oracle": ("SyncOracleClient", "AsyncOracleClient", "SyncOraclePool", "AsyncOraclePool"),
              "postgres": (
                  "SyncPostgresClient",
                  "AsyncPostgresClient",
                  "SyncPostgresPool",
                  "AsyncPostgresPool",
                  "SyncPostgresPortal",
                  "AsyncPostgresPortal",
                  "SyncPostgresArrowStream",
                  "AsyncPostgresArrowStream",
                  "SyncPostgresCopyOut",
                  "SyncPostgresCopyIn",
                  "AsyncPostgresCopyOut",
                  "AsyncPostgresCopyIn",
                  "AsyncPostgresListener",
                  "AsyncPostgresReplication",
              ),
              "redis": (
                  "SyncRedisClient",
                  "AsyncRedisClient",
                  "SyncRedisPipeline",
                  "AsyncRedisPipeline",
                  "SyncRedisListener",
                  "AsyncRedisListener",
              ),
              "spanner": ("SyncSpannerClient", "AsyncSpannerClient"),
              "sqlite": ("SyncSQLiteClient", "AsyncSQLiteClient"),
              "storage": ("SyncObjectStore", "AsyncObjectStore"),
              "valkey": (
                  "SyncValkeyClient",
                  "AsyncValkeyClient",
                  "SyncValkeyPipeline",
                  "AsyncValkeyPipeline",
                  "SyncValkeyListener",
                  "AsyncValkeyListener",
              ),
          }.items():
              module = importlib.import_module(f"vertebra._{name}")
              assert pathlib.Path(module.__file__).is_relative_to(sys.prefix)
              assert all(hasattr(module, export) for export in exports)
              assert all(isinstance(getattr(module, export), type) for export in exports if export[0].isupper())
              assert all(not hasattr(_vertebra, export) for export in exports)
              assert importlib.metadata.version(f"vertebra-{name}") == vertebra.__version__
              if name == "postgres":
                  assert module.GIL_USED is False
                  assert isinstance(module.FREE_THREADED, bool)
                  assert module.SyncPostgresClient(user="u", database="d").closed is True
                  assert module.AsyncPostgresClient(user="u", database="d").parameters == {}
                  sync_pool = module.SyncPostgresPool(
                      user="u", database="d", sslmode="disable", min_size=0, max_size=2
                  )
                  async_pool = module.AsyncPostgresPool(
                      user="u", database="d", sslmode="disable", min_size=0, max_size=2
                  )
                  sync_pool.validate_configuration(
                      user="u", database="d", sslmode="disable", min_size=0, max_size=4
                  )
                  async_pool.validate_configuration(
                      user="u", database="d", sslmode="disable", min_size=0, max_size=4
                  )
                  assert sync_pool.closed is False and async_pool.closed is False
                  sync_pool.close()
                  assert sync_pool.closed is True
          assert not hasattr(_vertebra, "Bundler")
          assert not hasattr(_vertebra, "SyncBigQueryClient")
          assert not hasattr(_vertebra, "SyncDuckDBClient")
          assert not hasattr(_vertebra, "SyncMSSQLClient")
          assert not hasattr(_vertebra, "SyncMySQLClient")
          assert not hasattr(_vertebra, "SyncObjectStore")
          assert not hasattr(_vertebra, "SyncOracleClient")
          assert not hasattr(_vertebra, "SyncPostgresClient")
          assert not hasattr(_vertebra, "SyncSpannerClient")
          assert pathlib.Path(vertebra.__file__).is_relative_to(sys.prefix)
          PY

  upload_release:
    name: Upload wheels and sdist to GitHub Release
    needs: [build_wheels, build_sdist, test_wheels]
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: cibw-*
          path: dist
          merge-multiple: true

      - name: Attach distributions to GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            dist/*.whl
            dist/*.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  upload_pypi:
    needs: [build_wheels, build_sdist, test_wheels]
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/vertebra-core
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: cibw-*
          path: dist
          merge-multiple: true

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
          skip-existing: true

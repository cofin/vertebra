name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      python: ${{ steps.filter.outputs.python }}
      rust: ${{ steps.filter.outputs.rust }}
      typescript: ${{ steps.filter.outputs.typescript }}
      docs: ${{ steps.filter.outputs.docs }}
      ci: ${{ steps.filter.outputs.ci }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            python:
              - 'src/py/**'
              - 'tools/**'
              - 'pyproject.toml'
              - 'uv.lock'
            rust:
              - 'src/rs/**'
            typescript:
              - 'src/ts/**'
            docs:
              - 'docs/**'
              - 'zensical.toml'
              - 'tools/docs/**'
              - '.github/workflows/docs.yml'
              - 'src/py/vertebra/**'
              - 'src/ts/vertebra-client/src/**'
              - 'pyproject.toml'
              - 'uv.lock'
            ci:
              - '.github/**'
              - 'Makefile'
              - '.pre-commit-config.yaml'
              - 'biome.json'

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [changes]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: oven-sh/setup-bun@v2
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - name: Install dependencies
        run: make ts-install
      - name: Run lint
        run: make lint-all

  test-python:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [changes]
    if: needs.changes.outputs.python == 'true' || needs.changes.outputs.rust == 'true' || needs.changes.outputs.ci == 'true'
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14", "3.14t", "3.15", "3.15t"]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}
      - name: Run tests
        run: make py-test
      - name: Generate coverage
        if: matrix.python-version == '3.12'
        run: make coverage
      - name: Upload coverage
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v7
        with:
          name: python-coverage
          path: coverage.xml

  test-rust:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [changes]
    if: needs.changes.outputs.rust == 'true' || needs.changes.outputs.ci == 'true'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - name: Check Windows target portability
        working-directory: src/rs
        run: cargo check -p vertebra-core --target x86_64-pc-windows-msvc --no-default-features
      - name: Run Rust tests
        run: make rs-test

  test-rust-features:
    needs: [changes]
    if: needs.changes.outputs.rust == 'true' || needs.changes.outputs.ci == 'true'
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            features: tls,compression
          - os: macos-latest
            features: tls,compression,macos-ulock
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - name: Test with feature flags
        working-directory: src/rs
        env:
          CARGO_FEATURES: ${{ matrix.features }}
        run: cargo test --workspace --features "$CARGO_FEATURES"

  test-typescript:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [changes]
    if: needs.changes.outputs.typescript == 'true' || needs.changes.outputs.ci == 'true'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
      - name: Install
        run: make ts-install
      - name: Build TypeScript package
        run: make ts-build
      - name: Run TS tests
        run: make ts-test

  build-docs:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [changes]
    if: needs.changes.outputs.docs == 'true' || needs.changes.outputs.ci == 'true'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          python-version: "3.12"
      - name: Install documentation dependencies
        run: uv sync --frozen --no-install-project --only-group doc
      - name: Build and verify documentation
        run: make docs

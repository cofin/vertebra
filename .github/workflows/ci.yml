name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      agents: ${{ steps.filter.outputs.agents }}
      python: ${{ steps.filter.outputs.python }}
      rust: ${{ steps.filter.outputs.rust }}
      typescript: ${{ steps.filter.outputs.typescript }}
      docs: ${{ steps.filter.outputs.docs }}
      ci: ${{ steps.filter.outputs.ci }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
          persist-credentials: false
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            agents:
              - '.agents/**'
              - '.codex/**'
              - 'AGENTS.md'
              - '.github/workflows/ci.yml'
            python:
              - 'src/py/**'
              - 'tools/**'
              - 'pyproject.toml'
              - 'uv.lock'
            rust:
              - 'src/rs/**'
            typescript:
              - 'src/ts/**'
            docs:
              - 'docs/**'
              - 'zensical.toml'
              - 'tools/docs/**'
              - '.github/workflows/docs.yml'
              - 'src/py/vertebra/**'
              - 'src/ts/vertebra-client/src/**'
              - 'pyproject.toml'
              - 'uv.lock'
            ci:
              - 'Makefile'
              - '.pre-commit-config.yaml'
              - 'biome.json'

  review-check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [changes]
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.agents == 'true' || needs.changes.outputs.python == 'true' || needs.changes.outputs.ci == 'true'
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          python-version: "3.12"
      - name: Validate review setup and OKF bundles
        run: uv run --no-project --python 3.12 --with "msgspec>=0.18" python -m tools.scripts.review_setup validate

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: [changes]
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.python == 'true' || needs.changes.outputs.rust == 'true' || needs.changes.outputs.typescript == 'true' || needs.changes.outputs.ci == 'true'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "src/rs"
          shared-key: "vertebra"
          cache-on-failure: true
      - uses: oven-sh/setup-bun@v2
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - name: Install dependencies
        run: make ts-install
      - name: Run lint
        env:
          CARGO_PROFILE_DEV_DEBUG: "0"
          CARGO_INCREMENTAL: "0"
        run: make lint-all

  test-python:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    needs: [changes, lint]
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.python == 'true' || needs.changes.outputs.rust == 'true' || needs.changes.outputs.ci == 'true'
    strategy:
      fail-fast: true
      matrix:
        python-version: ["3.12", "3.13", "3.14", "3.14t", "3.15", "3.15t"]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "src/rs"
          key: "py-${{ matrix.python-version }}"
          shared-key: "vertebra"
          cache-on-failure: true
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}
      - name: Run tests
        env:
          CARGO_PROFILE_DEV_DEBUG: "0"
          CARGO_INCREMENTAL: "0"
        run: make py-test
      - name: Generate coverage
        if: matrix.python-version == '3.12'
        run: make coverage
      - name: Upload coverage
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v7
        with:
          name: python-coverage
          path: coverage.xml

  test-rust:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: [changes, lint]
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.rust == 'true' || needs.changes.outputs.ci == 'true'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "src/rs"
          shared-key: "vertebra"
          cache-on-failure: true
      - name: Check Windows target portability
        working-directory: src/rs
        run: cargo check -p vertebra-core --target x86_64-pc-windows-msvc --no-default-features
      - name: Reclaim Windows check target space
        run: rm -rf src/rs/target/x86_64-pc-windows-msvc
      - name: Run Rust tests
        env:
          CARGO_PROFILE_DEV_DEBUG: "0"
          CARGO_INCREMENTAL: "0"
        run: make rs-test

  test-rust-macos:
    needs: [changes, lint]
    if: github.event_name == 'workflow_dispatch'
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "src/rs"
          shared-key: "vertebra"
          cache-on-failure: true
      - name: Test with macOS ulock and feature flags
        working-directory: src/rs
        env:
          CARGO_PROFILE_DEV_DEBUG: "0"
          CARGO_INCREMENTAL: "0"
        run: cargo test --workspace --features tls,compression,gcp,macos-ulock

  test-typescript:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [changes, lint]
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.typescript == 'true' || needs.changes.outputs.ci == 'true'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
      - name: Install
        run: make ts-install
      - name: Build TypeScript package
        run: make ts-build
      - name: Run TS tests
        run: make ts-test

  build-docs:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [changes]
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.docs == 'true' || needs.changes.outputs.ci == 'true'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          python-version: "3.12"
      - name: Install documentation dependencies
        run: uv sync --frozen --no-install-project --only-group doc
      - name: Build and verify documentation
        run: make docs

  core-wheel-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [changes, lint]
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.python == 'true' || needs.changes.outputs.rust == 'true' || needs.changes.outputs.typescript == 'true' || needs.changes.outputs.ci == 'true'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "src/rs"
          shared-key: "vertebra"
          cache-on-failure: true
      - uses: oven-sh/setup-bun@v2
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          python-version: "3.12"
      - name: Build TypeScript client bundle
        run: make ts-install && make ts-build
      - name: Build core wheel and run vtb smoke suite
        env:
          CARGO_PROFILE_DEV_DEBUG: "0"
          CARGO_INCREMENTAL: "0"
        run: make core-wheel-check

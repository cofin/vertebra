name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:
    inputs:
      full_matrix:
        description: Run full Python, database, and macOS verification matrix
        type: boolean
        default: true

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  changes:
    runs-on: ubuntu-slim
    timeout-minutes: 5
    outputs:
      python: ${{ steps.filter.outputs.python }}
      db_code: ${{ steps.filter.outputs.db_code }}
      rust: ${{ steps.filter.outputs.rust }}
      rust_macos: ${{ steps.filter.outputs.rust_macos }}
      typescript: ${{ steps.filter.outputs.typescript }}
      packaging: ${{ steps.filter.outputs.packaging }}
      docs: ${{ steps.filter.outputs.docs }}
      ci: ${{ steps.filter.outputs.ci }}
      full_matrix: ${{ steps.tier.outputs.full_matrix }}
      run_full: ${{ steps.tier.outputs.run_full }}
      macos_opt_in: ${{ steps.tier.outputs.macos_opt_in }}
      python_matrix: ${{ steps.tier.outputs.python_matrix }}
      pg_matrix: ${{ steps.tier.outputs.pg_matrix }}
      db_matrix: ${{ steps.tier.outputs.db_matrix }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
          persist-credentials: false
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            python:
              - 'src/py/**'
              - 'tools/**'
              - 'pyproject.toml'
              - 'uv.lock'
            db_code:
              - 'src/py/vertebra/db/**'
              - 'src/py/vertebra/extensions/sqlspec/**'
              - 'src/py/vertebra/extensions/alchemy/**'
              - 'src/py/vertebra/extensions/sqlalchemy/**'
              - 'src/py/vertebra/extensions/django/db/**'
              - 'src/py/tests/integration/db/**'
              - 'src/py/tests/integration/conftest.py'
              - 'src/py/tests/integration/conformance_gate.py'
              - 'src/rs/Cargo.toml'
              - 'src/rs/Cargo.lock'
              - 'src/rs/vertebra-core/**'
              - 'src/rs/vertebra-db/**'
              - 'src/rs/vertebra-postgres/**'
              - 'src/rs/vertebra-mysql/**'
              - 'src/rs/vertebra-mssql/**'
              - 'src/rs/vertebra-oracle/**'
              - 'src/rs/vertebra-sqlite/**'
              - 'src/rs/vertebra-duckdb/**'
              - 'src/rs/vertebra-redis/**'
              - 'src/rs/vertebra-valkey/**'
              - 'src/rs/vertebra-bigquery/**'
              - 'src/rs/vertebra-spanner/**'
              - 'uv.lock'
            rust:
              - 'src/rs/**'
            rust_macos:
              - 'src/rs/**'
            typescript:
              - 'src/ts/**'
              - 'biome.json'
            packaging:
              - 'src/rs/Cargo.toml'
              - 'src/rs/Cargo.lock'
              - 'src/rs/vertebra-*/Cargo.toml'
              - 'src/rs/vertebra-*/pyproject.toml'
              - 'src/rs/vertebra-*/**'
              - 'tools/scripts/*wheel*.py'
              - 'tools/scripts/build_server_binary.py'
              - 'tools/scripts/build_ci_wheels.py'
              - 'tools/scripts/smoke_vtb_run.py'
              - 'pyproject.toml'
              - 'Makefile'
            docs:
              - 'docs/**'
              - 'zensical.toml'
              - 'tools/docs/**'
              - '.github/workflows/docs.yml'
              - 'src/py/vertebra/**'
              - 'src/ts/vertebra-client/src/**'
              - 'pyproject.toml'
              - 'uv.lock'
            ci:
              - 'Makefile'
              - '.pre-commit-config.yaml'
              - 'biome.json'
              - '.github/actions/**'
              - '.github/workflows/ci.yml'
      - id: tier
        name: Resolve CI matrix tier
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref }}
          DISPATCH_FULL: ${{ inputs.full_matrix }}
          HAS_FULL_LABEL: ${{ contains(github.event.pull_request.labels.*.name, 'full-ci') }}
          HAS_MACOS_LABEL: ${{ contains(github.event.pull_request.labels.*.name, 'macos') }}
        run: |
          full_matrix="false"
          run_full="false"
          macos_opt_in="false"

          if [ "$EVENT_NAME" = "push" ] && [ "$REF_NAME" = "refs/heads/main" ]; then
            full_matrix="true"
          elif [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            run_full="true"
            if [ "$DISPATCH_FULL" = "true" ] || [ -z "$DISPATCH_FULL" ]; then
              full_matrix="true"
            fi
          elif [ "$EVENT_NAME" = "schedule" ]; then
            recent_commit="$(git log -1 --since='24 hours ago' --format='%H')"
            if [ -n "$recent_commit" ]; then
              full_matrix="true"
              run_full="true"
            fi
          elif [ "$HAS_FULL_LABEL" = "true" ]; then
            full_matrix="true"
            macos_opt_in="true"
          fi

          if [ "$HAS_MACOS_LABEL" = "true" ]; then
            macos_opt_in="true"
          fi

          if [ "$full_matrix" = "true" ]; then
            python_matrix='["3.12","3.13","3.14","3.14t","3.15","3.15t"]'
            pg_matrix='["14","15","16","17","18"]'
            db_matrix='[{"engine":"duckdb","package":"duckdb","version":"","python-version":"3.12"},{"engine":"duckdb","package":"duckdb","version":"","python-version":"3.14t"},{"engine":"sqlite","package":"sqlite","version":"","python-version":"3.12"},{"engine":"sqlite","package":"sqlite","version":"","python-version":"3.14t"},{"engine":"mysql","package":"mysql","version":"8.0","python-version":"3.12"},{"engine":"mysql","package":"mysql","version":"8.4","python-version":"3.12"},{"engine":"mysql","package":"mysql","version":"9.7","python-version":"3.12"},{"engine":"mysql","package":"mysql","version":"8.4","python-version":"3.14t"},{"engine":"mariadb","package":"mysql","version":"11.4","python-version":"3.12"},{"engine":"mariadb","package":"mysql","version":"11.8","python-version":"3.12"},{"engine":"mssql","package":"mssql","version":"2022","python-version":"3.12"},{"engine":"mssql","package":"mssql","version":"2025","python-version":"3.12"},{"engine":"redis","package":"redis","version":"","python-version":"3.12"},{"engine":"redis","package":"redis","version":"","python-version":"3.14t"},{"engine":"valkey","package":"valkey","version":"","python-version":"3.12"},{"engine":"valkey","package":"valkey","version":"","python-version":"3.14t"}]'
          else
            python_matrix='["3.12","3.14t","3.15t"]'
            pg_matrix='["14","18"]'
            db_matrix='[{"engine":"duckdb","package":"duckdb","version":"","python-version":"3.12"},{"engine":"sqlite","package":"sqlite","version":"","python-version":"3.12"},{"engine":"mysql","package":"mysql","version":"8.4","python-version":"3.12"},{"engine":"mariadb","package":"mysql","version":"11.8","python-version":"3.12"},{"engine":"mssql","package":"mssql","version":"2025","python-version":"3.12"},{"engine":"redis","package":"redis","version":"","python-version":"3.12"},{"engine":"valkey","package":"valkey","version":"","python-version":"3.12"}]'
          fi

          {
            echo "full_matrix=${full_matrix}"
            echo "run_full=${run_full}"
            echo "macos_opt_in=${macos_opt_in}"
            echo "python_matrix=${python_matrix}"
            echo "pg_matrix=${pg_matrix}"
            echo "db_matrix=${db_matrix}"
          } >> "$GITHUB_OUTPUT"

  lint-ts:
    runs-on: ubuntu-slim
    timeout-minutes: 5
    needs: [changes]
    if: >-
      needs.changes.outputs.run_full == 'true' ||
      needs.changes.outputs.typescript == 'true' ||
      needs.changes.outputs.ci == 'true'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
      - uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('src/ts/vertebra-client/bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-
      - name: Install and check TypeScript package
        working-directory: src/ts/vertebra-client
        run: |
          bun install --frozen-lockfile
          bunx biome check .
          bunx tsc --noEmit

  build-ts:
    runs-on: ubuntu-slim
    timeout-minutes: 5
    needs: [changes]
    if: >-
      needs.changes.outputs.run_full == 'true' ||
      needs.changes.outputs.typescript == 'true' ||
      needs.changes.outputs.python == 'true' ||
      needs.changes.outputs.rust == 'true' ||
      needs.changes.outputs.packaging == 'true' ||
      needs.changes.outputs.ci == 'true'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
      - uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('src/ts/vertebra-client/bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-
      - name: Build TypeScript client bundle once
        working-directory: src/ts/vertebra-client
        run: |
          bun install --frozen-lockfile
          bun run build
      - uses: actions/upload-artifact@v7
        with:
          name: ts-bundle
          path: |
            src/py/vertebra/server/_js/bundle/
            src/ts/vertebra-client/dist/
          retention-days: 1
          compression-level: 6
          if-no-files-found: error

  lint-python:
    runs-on: ubuntu-slim
    timeout-minutes: 10
    needs: [changes]
    if: >-
      needs.changes.outputs.run_full == 'true' ||
      needs.changes.outputs.python == 'true' ||
      needs.changes.outputs.rust == 'true' ||
      needs.changes.outputs.ci == 'true'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: $/.github/actions/setup-python-env
        with:
          python-version: "3.12"
          save-cache: ${{ github.ref == 'refs/heads/main' }}
      - name: Cache mypy and ruff state
        uses: actions/cache@v6
        with:
          path: |
            .mypy_cache
            .ruff_cache
          key: py-lint-${{ runner.os }}-3.12-${{ hashFiles('pyproject.toml', 'uv.lock') }}-${{ github.sha }}
          restore-keys: |
            py-lint-${{ runner.os }}-3.12-${{ hashFiles('pyproject.toml', 'uv.lock') }}-
            py-lint-${{ runner.os }}-3.12-
      - name: Install Python lint dependencies without compiling Rust
        run: uv sync --frozen --no-install-local --all-extras --group test --group lint --group build
      - name: Check Python lint, formatting, static types, and extras parity
        run: |
          uv run --no-sync ruff check src/py/vertebra src/py/tests tools/scripts tools/pgo tools/benchmarks tools/docs docs/examples
          uv run --no-sync ruff format --check src/py/vertebra src/py/tests tools/scripts tools/pgo tools/benchmarks tools/docs docs/examples
          uv run --no-sync mypy src/py/vertebra src/py/tests/unit src/py/tests/integration tools/scripts tools/pgo tools/benchmarks tools/docs docs/examples
          uv run --no-sync pyright src/py/vertebra
          uv run --no-sync python tools/scripts/check_extras.py

  lint-rust:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: [changes]
    if: >-
      needs.changes.outputs.run_full == 'true' ||
      needs.changes.outputs.rust == 'true' ||
      needs.changes.outputs.ci == 'true'
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.SCCACHE_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.SCCACHE_SECRET_ACCESS_KEY }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: $/.github/actions/setup-rust-build
        with:
          components: "clippy, rustfmt"
          shared-key: "vertebra-clippy"
          save-cache: ${{ github.ref == 'refs/heads/main' }}
          cache-on-failure: ${{ github.ref == 'refs/heads/main' }}
          sccache-backend: ${{ vars.SCCACHE_BACKEND }}
          sccache-bucket: ${{ vars.SCCACHE_BUCKET }}
          sccache-endpoint: ${{ vars.SCCACHE_ENDPOINT }}
          sccache-region: ${{ vars.SCCACHE_REGION || 'auto' }}
      - name: Check Rust formatting and Clippy lints
        working-directory: src/rs
        run: |
          cargo fmt --all -- --check
          cargo clippy --workspace --all-targets --features tls,http3,compression,gcp -- -D warnings

  test-typescript:
    runs-on: ubuntu-slim
    timeout-minutes: 10
    needs: [changes, lint-ts, build-ts]
    if: >-
      always() &&
      needs.changes.result == 'success' &&
      (needs.lint-ts.result == 'success' || needs.lint-ts.result == 'skipped') &&
      needs.build-ts.result == 'success' &&
      (needs.changes.outputs.run_full == 'true' || needs.changes.outputs.typescript == 'true' || needs.changes.outputs.ci == 'true')
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
      - uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('src/ts/vertebra-client/bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-
      - uses: actions/download-artifact@v8
        with:
          name: ts-bundle
          path: src
      - name: Run TypeScript tests
        working-directory: src/ts/vertebra-client
        run: |
          bun install --frozen-lockfile
          NODE_OPTIONS="${NODE_OPTIONS:+${NODE_OPTIONS} }--localstorage-file=${TMPDIR:-/tmp}/vertebra-vitest-localstorage" bun run test

  build-docs:
    runs-on: ubuntu-slim
    timeout-minutes: 10
    needs: [changes]
    if: >-
      needs.changes.outputs.run_full == 'true' ||
      needs.changes.outputs.docs == 'true' ||
      needs.changes.outputs.ci == 'true'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: $/.github/actions/setup-python-env
        with:
          python-version: "3.12"
          save-cache: ${{ github.ref == 'refs/heads/main' }}
      - name: Install documentation dependencies
        run: uv sync --frozen --no-install-project --only-group doc
      - name: Build and verify documentation
        run: |
          rm -rf site .cache
          PYTHONPATH="src/py:." uv run --no-sync python -m tools.docs.scan_public_docstrings --check-leaks --check-overloads --check-typeddicts --stage-inventory-cache /tmp/vertebra-mkdocs-cache src/py/vertebra
          PYTHONPATH="src/py:." uv run --no-sync python -m tools.docs.generate_cli_docs --check
          XDG_CACHE_HOME="/tmp/vertebra-mkdocs-cache" PYTHONPATH="src/py:." uv run --no-sync zensical build --clean
          PYTHONPATH="src/py:." uv run --no-sync python -m tools.docs.postbuild --site-dir site --docs-dir docs --zensical-config zensical.toml --rust-doc-dir "src/rs/target/doc"
          PYTHONPATH="src/py:." uv run --no-sync python -m tools.docs.verify_docs_artifacts --site-dir site

  build-native:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    needs: [changes, build-ts, lint-python, lint-ts]
    if: >-
      always() &&
      needs.changes.result == 'success' &&
      needs.build-ts.result == 'success' &&
      (needs.lint-python.result == 'success' || needs.lint-python.result == 'skipped') &&
      (needs.lint-ts.result == 'success' || needs.lint-ts.result == 'skipped') &&
      (
        needs.changes.outputs.run_full == 'true' ||
        needs.changes.outputs.python == 'true' ||
        needs.changes.outputs.rust == 'true' ||
        needs.changes.outputs.packaging == 'true' ||
        needs.changes.outputs.ci == 'true'
      )
    strategy:
      fail-fast: false
      matrix:
        python-version: ${{ fromJSON(needs.changes.outputs.python_matrix) }}
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.SCCACHE_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.SCCACHE_SECRET_ACCESS_KEY }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: $/.github/actions/setup-rust-build
        with:
          shared-key: "vertebra-dev"
          save-cache: ${{ github.ref == 'refs/heads/main' && matrix.python-version == '3.12' }}
          cache-on-failure: ${{ github.ref == 'refs/heads/main' && matrix.python-version == '3.12' }}
          sccache-backend: ${{ vars.SCCACHE_BACKEND }}
          sccache-bucket: ${{ vars.SCCACHE_BUCKET }}
          sccache-endpoint: ${{ vars.SCCACHE_ENDPOINT }}
          sccache-region: ${{ vars.SCCACHE_REGION || 'auto' }}
      - uses: $/.github/actions/setup-python-env
        with:
          python-version: ${{ matrix.python-version }}
          cache-python: ${{ matrix.python-version == '3.14t' || matrix.python-version == '3.15t' }}
          prune-cache: ${{ matrix.python-version != '3.14t' && matrix.python-version != '3.15t' }}
          save-cache: ${{ github.ref == 'refs/heads/main' || matrix.python-version == '3.14t' || matrix.python-version == '3.15t' }}
      - name: Download prebuilt TypeScript client bundle
        uses: actions/download-artifact@v8
        with:
          name: ts-bundle
          path: src
      - name: Install build and stubtest dependencies
        run: uv sync --frozen --no-install-local --group build --group lint
      - name: Build native wheels and server binary once for Python ${{ matrix.python-version }}
        env:
          CARGO_PROFILE_DEV_DEBUG: "0"
          CARGO_INCREMENTAL: "0"
          BUILD_SDISTS: ${{ matrix.python-version == '3.12' }}
        run: |
          if [ "$BUILD_SDISTS" = "true" ]; then
            PYTHONPATH="src/py:." uv run --no-sync python tools/scripts/build_ci_wheels.py build \
              --wheel-dir dist/wheels \
              --sdist-dir dist/sdist \
              --profile dev \
              --with-server
          else
            PYTHONPATH="src/py:." uv run --no-sync python tools/scripts/build_ci_wheels.py build \
              --wheel-dir dist/wheels \
              --profile dev \
              --with-server
          fi
      - name: Verify native extension stubs (stubtest)
        run: |
          PYTHONPATH="src/py:." uv run --no-sync python tools/scripts/build_ci_wheels.py install --wheel-dir dist/wheels
          uv run --no-sync python -c 'import importlib.util, sys; missing = [m for m in ("vertebra._vertebra", "vertebra._bundler", "vertebra._storage", "vertebra._mysql", "vertebra._bigquery", "vertebra._mssql", "vertebra._spanner", "vertebra._duckdb", "vertebra._oracle", "vertebra._postgres", "vertebra._sqlite", "vertebra._redis", "vertebra._valkey") if importlib.util.find_spec(m) is None]; sys.exit(f"Missing native extensions: {missing}") if missing else None'
          uv run --no-sync python -m mypy.stubtest vertebra._vertebra vertebra._bundler vertebra._storage vertebra._mysql vertebra._bigquery vertebra._mssql vertebra._spanner vertebra._duckdb vertebra._oracle vertebra._postgres vertebra._sqlite vertebra._redis vertebra._valkey
      - name: Report sccache stats
        if: vars.SCCACHE_BACKEND != ''
        run: sccache --show-stats || true
      - name: Upload built wheels
        uses: actions/upload-artifact@v7
        with:
          name: ci-wheels-${{ matrix.python-version }}
          path: dist/wheels/*.whl
          retention-days: 1
          compression-level: 6
          if-no-files-found: error
      - name: Upload companion source distributions
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v7
        with:
          name: ci-sdists-3.12
          path: dist/sdist/*.tar.gz
          retention-days: 1
          compression-level: 6
          if-no-files-found: error

  test-python:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: [changes, build-native]
    if: >-
      needs.changes.outputs.run_full == 'true' ||
      needs.changes.outputs.python == 'true' ||
      needs.changes.outputs.rust == 'true' ||
      needs.changes.outputs.ci == 'true'
    strategy:
      fail-fast: false
      matrix:
        python-version: ${{ fromJSON(needs.changes.outputs.python_matrix) }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: $/.github/actions/setup-python-env
        with:
          python-version: ${{ matrix.python-version }}
          save-cache: false
      - name: Download prebuilt wheels and TS bundle
        uses: actions/download-artifact@v8
        with:
          name: ci-wheels-${{ matrix.python-version }}
          path: dist/wheels
      - uses: actions/download-artifact@v8
        with:
          name: ts-bundle
          path: src
      - name: Install test dependencies and prebuilt wheels
        run: |
          uv sync --frozen --no-install-local --group test
          PYTHONPATH="src/py:." uv run --no-sync python tools/scripts/build_ci_wheels.py install --wheel-dir dist/wheels
      - name: Run Python tests with coverage (3.12)
        if: matrix.python-version == '3.12'
        run: |
          uv run --no-sync pytest -n auto --dist loadscope src/py/tests/unit --cov --cov-report= -q
          uv run --no-sync pytest src/py/tests/integration --cov --cov-append --cov-report= -q
          uv run --no-sync coverage xml -i
      - name: Run Python tests
        if: matrix.python-version != '3.12'
        run: |
          uv run --no-sync pytest -n auto --dist loadscope src/py/tests/unit -q
          uv run --no-sync pytest src/py/tests/integration -q
      - name: Upload coverage
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v7
        with:
          name: python-coverage
          path: coverage.xml
          retention-days: 7

  verify-wheels:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [changes, build-native]
    if: >-
      needs.changes.outputs.run_full == 'true' ||
      needs.changes.outputs.packaging == 'true' ||
      needs.changes.outputs.python == 'true' ||
      needs.changes.outputs.rust == 'true' ||
      needs.changes.outputs.ci == 'true'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: $/.github/actions/setup-python-env
        with:
          python-version: "3.12"
          save-cache: false
      - uses: actions/download-artifact@v8
        with:
          name: ci-wheels-3.12
          path: dist/wheels
      - uses: actions/download-artifact@v8
        with:
          name: ci-sdists-3.12
          path: dist/sdist
      - name: Install runtime verification tools without compiling Rust
        run: uv sync --frozen --no-install-local --group build
      - name: Verify all 13 prebuilt wheels, sdists, linkage, isolation, and vtb smoke
        run: PYTHONPATH="src/py:." uv run --no-sync python tools/scripts/build_ci_wheels.py verify --wheel-dir dist/wheels --sdist-dir dist/sdist

  test-rust:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    needs: [changes, lint-rust]
    if: >-
      needs.changes.outputs.run_full == 'true' ||
      needs.changes.outputs.rust == 'true' ||
      needs.changes.outputs.ci == 'true'
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.SCCACHE_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.SCCACHE_SECRET_ACCESS_KEY }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: $/.github/actions/setup-rust-build
        with:
          targets: "x86_64-pc-windows-msvc"
          shared-key: "vertebra-dev"
          save-cache: false
          sccache-backend: ${{ vars.SCCACHE_BACKEND }}
          sccache-bucket: ${{ vars.SCCACHE_BUCKET }}
          sccache-endpoint: ${{ vars.SCCACHE_ENDPOINT }}
          sccache-region: ${{ vars.SCCACHE_REGION || 'auto' }}
      - uses: $/.github/actions/setup-python-env
        with:
          python-version: "3.12"
          save-cache: false
      - name: Provision Python runtime for embedded PyO3 tests
        run: uv venv --python 3.12 .venv && uv pip install --python .venv/bin/python "msgspec>=0.18"
      - name: Check Windows target portability
        working-directory: src/rs
        run: cargo check -p vertebra-core --target x86_64-pc-windows-msvc --no-default-features
      - name: Reclaim Windows check target space
        run: rm -rf src/rs/target/x86_64-pc-windows-msvc
      - name: Run Rust tests
        run: make rs-test

  test-rust-macos:
    runs-on: macos-latest
    timeout-minutes: 35
    needs: [changes, lint-rust]
    if: >-
      (needs.changes.outputs.run_full == 'true' || needs.changes.outputs.rust_macos == 'true' || needs.changes.outputs.ci == 'true') &&
      (needs.changes.outputs.full_matrix == 'true' || needs.changes.outputs.macos_opt_in == 'true')
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.SCCACHE_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.SCCACHE_SECRET_ACCESS_KEY }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: $/.github/actions/setup-rust-build
        with:
          shared-key: "vertebra-macos"
          enable-fast-linker: "false"
          save-cache: ${{ github.ref == 'refs/heads/main' }}
          cache-on-failure: ${{ github.ref == 'refs/heads/main' }}
          sccache-backend: ${{ vars.SCCACHE_BACKEND }}
          sccache-bucket: ${{ vars.SCCACHE_BUCKET }}
          sccache-endpoint: ${{ vars.SCCACHE_ENDPOINT }}
          sccache-region: ${{ vars.SCCACHE_REGION || 'auto' }}
      - uses: $/.github/actions/setup-python-env
        with:
          python-version: "3.12"
          save-cache: ${{ github.ref == 'refs/heads/main' }}
      - name: Provision Python runtime for embedded PyO3 tests
        run: uv venv --python 3.12 .venv && uv pip install --python .venv/bin/python "msgspec>=0.18"
      - name: Test with macOS feature flags
        working-directory: src/rs
        run: |
          PY_BIN="$(realpath "$GITHUB_WORKSPACE/.venv/bin/python")"
          PY_PREFIX="$("$PY_BIN" -c 'import sys; print(sys.base_prefix)')"
          PY_LIBDIR="$("$PY_BIN" -c 'import sysconfig; print(sysconfig.get_config_var("LIBDIR"))')"
          PY_SITE="$("$GITHUB_WORKSPACE/.venv/bin/python" -c 'import os, site; print(os.pathsep.join(site.getsitepackages()))')"
          PYTHONPATH="$GITHUB_WORKSPACE/src/py:$PY_SITE" PYTHONHOME="$PY_PREFIX" DYLD_FALLBACK_LIBRARY_PATH="$PY_LIBDIR" PYO3_PYTHON="$PY_BIN" cargo test --workspace --features tls,http3,compression,gcp

  postgres-conformance:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: [changes, build-native]
    if: >-
      needs.changes.outputs.run_full == 'true' ||
      needs.changes.outputs.db_code == 'true' ||
      needs.changes.outputs.ci == 'true'
    strategy:
      fail-fast: false
      matrix:
        pg_version: ${{ fromJSON(needs.changes.outputs.pg_matrix) }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: $/.github/actions/setup-python-env
        with:
          python-version: "3.12"
          save-cache: false
      - name: Download prebuilt wheels
        uses: actions/download-artifact@v8
        with:
          name: ci-wheels-3.12
          path: dist/wheels
      - name: Install test dependencies and prebuilt postgres wheel
        run: |
          uv sync --frozen --no-install-local --group test
          PYTHONPATH="src/py:." uv run --no-sync python tools/scripts/build_ci_wheels.py install --wheel-dir dist/wheels --packages core,postgres
      - name: Run zero-skip PostgreSQL ${{ matrix.pg_version }} conformance
        env:
          VERTEBRA_CONFORMANCE_DOCKER: "1"
          VERTEBRA_CONFORMANCE_POSTGRES_REQUIRE_ZERO_SKIPS: "1"
          VERTEBRA_CONFORMANCE_ENGINES: postgres
          VERTEBRA_CONFORMANCE_POSTGRES_VERSION: ${{ matrix.pg_version }}
        run: uv run --no-sync pytest src/py/tests/integration/db/test_driver_conformance.py -v
      - name: Run live replication, feature, deadline, and pool-sharing suites (PG18)
        if: matrix.pg_version == '18'
        env:
          VERTEBRA_CONFORMANCE_DOCKER: "1"
          VERTEBRA_CONFORMANCE_POSTGRES_REQUIRE_ZERO_SKIPS: "1"
          VERTEBRA_CONFORMANCE_ENGINES: postgres
        run: uv run --no-sync pytest src/py/tests/integration/db/test_postgres_replication_live.py src/py/tests/integration/db/test_postgres_native_features_live.py src/py/tests/integration/db/test_postgres_command_deadlines.py src/py/tests/integration/extensions/test_multiprocess_pool_sharing.py -k "postgres or not docker" -v

  test-db-conformance:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [changes, build-native]
    if: >-
      needs.changes.outputs.run_full == 'true' ||
      needs.changes.outputs.db_code == 'true' ||
      needs.changes.outputs.ci == 'true'
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.changes.outputs.db_matrix) }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: $/.github/actions/setup-python-env
        with:
          python-version: ${{ matrix.python-version }}
          save-cache: false
      - name: Download prebuilt wheels
        uses: actions/download-artifact@v8
        with:
          name: ci-wheels-${{ matrix.python-version }}
          path: dist/wheels
      - name: Install test dependencies and engine wheel
        env:
          WHEEL_PACKAGE: ${{ matrix.package }}
        run: |
          uv sync --frozen --no-install-local --group test
          PYTHONPATH="src/py:." uv run --no-sync python tools/scripts/build_ci_wheels.py install --wheel-dir dist/wheels --packages "core,${WHEEL_PACKAGE}"
      - name: Run zero-skip ${{ matrix.engine }} ${{ matrix.version }} conformance
        env:
          TARGET_ENGINE: ${{ matrix.engine }}
          TARGET_VERSION: ${{ matrix.version }}
        run: make db-conformance ENGINE="$TARGET_ENGINE" VERSION="$TARGET_VERSION"

  conformance-oracle:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [changes, build-native]
    if: >-
      needs.changes.outputs.run_full == 'true' ||
      needs.changes.outputs.db_code == 'true' ||
      needs.changes.outputs.ci == 'true'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: $/.github/actions/setup-python-env
        with:
          python-version: "3.12"
          save-cache: false
      - name: Free runner disk space for Oracle 23ai image
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h
      - name: Download prebuilt wheels
        uses: actions/download-artifact@v8
        with:
          name: ci-wheels-3.12
          path: dist/wheels
      - name: Install test dependencies and prebuilt oracle wheel
        run: |
          uv sync --frozen --no-install-local --group test
          PYTHONPATH="src/py:." uv run --no-sync python tools/scripts/build_ci_wheels.py install --wheel-dir dist/wheels --packages core,oracle
      - name: Run zero-skip Oracle 23ai conformance
        run: make db-conformance ENGINE=oracle VERSION=23ai

  cleanup-artifacts:
    runs-on: ubuntu-slim
    timeout-minutes: 5
    permissions:
      actions: write
      contents: read
    needs:
      - build-ts
      - build-native
      - test-typescript
      - test-python
      - verify-wheels
      - postgres-conformance
      - test-db-conformance
      - conformance-oracle
    if: >-
      always() &&
      (needs.build-ts.result == 'success' || needs.build-native.result == 'success')
    steps:
      - name: Remove ephemeral intra-run wheel and bundle artifacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import urllib.error
          import urllib.request

          token = os.environ["GH_TOKEN"]
          repo = os.environ["REPO"]
          run_id = os.environ["RUN_ID"]
          headers = {
              "Authorization": f"Bearer {token}",
              "Accept": "application/vnd.github+json",
              "X-GitHub-Api-Version": "2022-11-28",
          }
          list_url = f"https://api.github.com/repos/{repo}/actions/runs/{run_id}/artifacts?per_page=100"
          req = urllib.request.Request(list_url, headers=headers)
          with urllib.request.urlopen(req, timeout=20) as resp:
              payload = json.loads(resp.read().decode("utf-8"))
          deleted = 0
          for item in payload.get("artifacts", []):
              name = item.get("name", "")
              if name == "ts-bundle" or name.startswith(("ci-wheels-", "ci-sdists-")):
                  del_url = f"https://api.github.com/repos/{repo}/actions/artifacts/{item['id']}"
                  del_req = urllib.request.Request(del_url, headers=headers, method="DELETE")
                  try:
                      with urllib.request.urlopen(del_req, timeout=20):
                          deleted += 1
                  except urllib.error.HTTPError as exc:
                      if exc.code != 404:
                          raise
          print(f"Cleaned up {deleted} ephemeral artifact(s) for run {run_id}.")
          PY

name: Cache Cleanup

on:
  pull_request:
    types: [closed]

permissions:
  actions: write
  contents: read

jobs:
  cleanup:
    runs-on: ubuntu-slim
    timeout-minutes: 5
    steps:
      - name: Delete caches scoped to closed pull request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import urllib.error
          import urllib.parse
          import urllib.request

          token = os.environ["GH_TOKEN"]
          repo = os.environ["REPO"]
          pr_number = os.environ["PR_NUMBER"]
          ref = f"refs/pull/{pr_number}/merge"
          headers = {
              "Authorization": f"Bearer {token}",
              "Accept": "application/vnd.github+json",
              "X-GitHub-Api-Version": "2022-11-28",
          }
          encoded_ref = urllib.parse.quote(ref, safe="")
          seen_ids = set()
          deleted = 0
          while True:
              url = f"https://api.github.com/repos/{repo}/actions/caches?ref={encoded_ref}&per_page=100&page=1"
              req = urllib.request.Request(url, headers=headers)
              with urllib.request.urlopen(req, timeout=20) as resp:
                  payload = json.loads(resp.read().decode("utf-8"))
              entries = [e for e in payload.get("actions_caches", []) if e["id"] not in seen_ids]
              if not entries:
                  break
              deleted_in_batch = 0
              for entry in entries:
                  seen_ids.add(entry["id"])
                  del_url = f"https://api.github.com/repos/{repo}/actions/caches/{entry['id']}"
                  del_req = urllib.request.Request(del_url, headers=headers, method="DELETE")
                  try:
                      with urllib.request.urlopen(del_req, timeout=20):
                          deleted += 1
                          deleted_in_batch += 1
                  except urllib.error.HTTPError as exc:
                      if exc.code != 404:
                          raise
              if deleted_in_batch == 0 and len(entries) < 100:
                  break
          print(f"Deleted {deleted} cache entry/entries for {ref}.")
          PY

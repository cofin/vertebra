name: Security

on:
  push:
    branches: [main]
    paths:
      - '.github/**'
  pull_request:
    branches: ["**"]
    paths:
      - '.github/**'
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  zizmor:
    name: GitHub Actions Security Analysis
    runs-on: ubuntu-slim
    timeout-minutes: 5
    permissions:
      security-events: write
      contents: read
      actions: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Run zizmor
        uses: zizmorcore/zizmor-action@v0.8.1
        with:
          config: .github/zizmor.yml
          advanced-security: false
          annotations: true

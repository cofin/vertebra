name: Benchmarks

on:
  workflow_dispatch:
    inputs:
      full_benchmark:
        description: 'Run full benchmark (not quick mode)'
        type: boolean
        default: false
  release:
    types: [published]

concurrency:
  group: benchmark
  cancel-in-progress: false

permissions:
  contents: read

env:
  PYTHONUNBUFFERED: "1"
  UV_SYSTEM_PYTHON: "1"

jobs:
  benchmark:
    name: Vertebra Performance
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Bun
        uses: oven-sh/setup-bun@v2

      - name: Install oha
        uses: taiki-e/install-action@v2
        with:
          tool: oha

      - name: Install dependencies
        run: |
          uv python pin 3.12
          uv venv --clear
          uv sync --all-extras --dev
          make ts-install

      - name: Build Optimized
        run: make build

      - name: Run Benchmarks
        id: benchmark
        env:
          FULL_BENCHMARK: ${{ inputs.full_benchmark }}
        run: |
          if [ "$FULL_BENCHMARK" = "true" ]; then
            make bench-all
          else
            make bench
          fi

      - name: Upload Results
        uses: actions/upload-artifact@v7
        with:
          name: benchmark-results-${{ github.sha }}
          path: |
            tools/benchmarks/results/
          retention-days: 90

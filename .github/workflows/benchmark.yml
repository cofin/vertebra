name: Benchmarks

on:
  workflow_dispatch:
    inputs:
      full_benchmark:
        description: 'Run full benchmark (not quick mode)'
        type: boolean
        default: false
  release:
    types: [published]

concurrency:
  group: benchmark
  cancel-in-progress: false

permissions:
  contents: read

env:
  PYTHONUNBUFFERED: "1"
  UV_SYSTEM_PYTHON: "1"

jobs:
  benchmark:
    name: Vertebra Performance
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.SCCACHE_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.SCCACHE_SECRET_ACCESS_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install uv
        uses: $/.github/actions/setup-python-env
        with:
          python-version: "3.12"
          save-cache: true

      - name: Install Rust and cache
        uses: $/.github/actions/setup-rust-build
        with:
          shared-key: "vertebra-bench-release"
          save-cache: "true"
          sccache-backend: ${{ vars.SCCACHE_BACKEND }}
          sccache-bucket: ${{ vars.SCCACHE_BUCKET }}
          sccache-endpoint: ${{ vars.SCCACHE_ENDPOINT }}
          sccache-region: ${{ vars.SCCACHE_REGION || 'auto' }}

      - name: Install Bun
        uses: oven-sh/setup-bun@v2

      - uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('src/ts/vertebra-client/bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-

      - name: Install oha
        uses: taiki-e/install-action@v2
        with:
          tool: oha

      - name: Install dependencies
        run: |
          uv python pin 3.12
          uv venv --clear
          uv sync --frozen --no-install-local --all-extras --dev --group bench
          cd src/ts/vertebra-client && bun install --frozen-lockfile

      - name: Build Optimized
        run: UV_NO_SYNC=1 make build

      - name: Run Benchmarks
        id: benchmark
        env:
          FULL_BENCHMARK: ${{ inputs.full_benchmark }}
        run: |
          if [ "$FULL_BENCHMARK" = "true" ]; then
            make bench-all-run
          else
            make bench-run
          fi

      - name: Upload Results
        uses: actions/upload-artifact@v7
        with:
          name: benchmark-results-${{ github.sha }}
          path: |
            tools/benchmarks/results/
          retention-days: 30

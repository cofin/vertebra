name: Release Binaries

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x64
            os: ubuntu-latest
            bin_src: target/release/vertebra-server
            bin_name: vertebra-server-linux-x64
          - target: darwin-arm64
            os: macos-14
            bin_src: target/release/vertebra-server
            bin_name: vertebra-server-darwin-arm64
          - target: darwin-x64
            os: macos-15-intel
            bin_src: target/release/vertebra-server
            bin_name: vertebra-server-darwin-x64
          - target: windows-x64
            os: windows-latest
            bin_src: target/release/vertebra-server.exe
            bin_name: vertebra-server-windows-x64.exe

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Bun
        uses: oven-sh/setup-bun@v2

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          python-version: "3.12"

      - name: Build TypeScript client bundle
        shell: bash
        run: |
          cd src/ts/vertebra-client
          bun install
          bun run build

      - name: Build release binary
        shell: bash
        run: |
          uv venv --clear --python 3.12
          PY_BIN="$(uv python find 3.12)"
          CARGO_TARGET_DIR="target" PYO3_PYTHON="$PY_BIN" cargo build \
            --manifest-path src/rs/Cargo.toml \
            --bin vertebra-server \
            --release \
            --features vertebra-http/python,vertebra-http/tls,vertebra-http/compression
          mkdir -p dist
          cp "${{ matrix.bin_src }}" "dist/${{ matrix.bin_name }}"

      - name: Upload Artifact
        uses: actions/upload-artifact@v7
        with:
          name: vertebra-${{ matrix.target }}
          path: dist/${{ matrix.bin_name }}

      - name: Upload to Release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v3
        with:
          files: dist/${{ matrix.bin_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

name: Release Binaries

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x64
            os: ubuntu-latest
          - target: darwin-arm64
            os: macos-14
          - target: darwin-x64
            os: macos-13
          - target: windows-x64
            os: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Setup uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install PyApp
        run: cargo install pyapp

      - name: Install dependencies
        run: uv sync

      - name: Build Binary
        run: uv run vtb build --onefile --target ${{ matrix.target }} --output dist/vertebra-${{ matrix.target }}
        env:
          VERTEBRA_DEBUG: 1

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: vertebra-${{ matrix.target }}
          path: dist/vertebra-${{ matrix.target }}*

      - name: Upload to Release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v1
        with:
          files: dist/vertebra-${{ matrix.target }}*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

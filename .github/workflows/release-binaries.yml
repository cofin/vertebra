name: Release Binaries

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x64
            os: ubuntu-latest
          - target: darwin-arm64
            os: macos-14
          - target: darwin-x64
            os: macos-13
          - target: windows-x64
            os: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: make install

      - name: Build
        run: make build

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: vertebra-${{ matrix.target }}
          path: dist/vertebra*

      - name: Upload to Release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: dist/vertebra*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

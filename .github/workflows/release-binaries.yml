name: Release Binaries

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build_ts:
    name: Build TypeScript client bundle
    runs-on: ubuntu-slim
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
      - uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('src/ts/vertebra-client/bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-
      - name: Build TypeScript client bundle once
        working-directory: src/ts/vertebra-client
        run: |
          bun install --frozen-lockfile
          bun run build
      - uses: actions/upload-artifact@v7
        with:
          name: release-bin-ts-bundle
          path: |
            src/py/vertebra/server/_js/bundle/
            src/ts/vertebra-client/dist/
          retention-days: 1
          compression-level: 6
          if-no-files-found: error

  build:
    name: Build ${{ matrix.target }}
    needs: [build_ts]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x64
            os: ubuntu-latest
            bin_src: target/release/vertebra-server
            bin_name: vertebra-server-linux-x64
          - target: linux-arm64
            os: ubuntu-24.04-arm
            bin_src: target/release/vertebra-server
            bin_name: vertebra-server-linux-arm64
          - target: darwin-arm64
            os: macos-14
            bin_src: target/release/vertebra-server
            bin_name: vertebra-server-darwin-arm64
          - target: darwin-x64
            os: macos-15-intel
            bin_src: target/release/vertebra-server
            bin_name: vertebra-server-darwin-x64
          - target: windows-x64
            os: windows-latest
            bin_src: target/release/vertebra-server.exe
            bin_name: vertebra-server-windows-x64.exe
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.SCCACHE_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.SCCACHE_SECRET_ACCESS_KEY }}

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Download prebuilt TypeScript client bundle
        uses: actions/download-artifact@v8
        with:
          name: release-bin-ts-bundle
          path: .

      - name: Setup Rust and cache
        uses: ./.github/actions/setup-rust-build
        with:
          shared-key: "vertebra-release-bin-${{ matrix.target }}"
          cache-targets: "false"
          save-cache: "true"
          enable-fast-linker: ${{ runner.os == 'Linux' }}
          sccache-backend: ${{ vars.SCCACHE_BACKEND }}
          sccache-bucket: ${{ vars.SCCACHE_BUCKET }}
          sccache-endpoint: ${{ vars.SCCACHE_ENDPOINT }}
          sccache-region: ${{ vars.SCCACHE_REGION || 'auto' }}

      - name: Install uv
        uses: ./.github/actions/setup-python-env
        with:
          python-version: "3.12"
          save-cache: false

      - name: Build release binary
        shell: bash
        env:
          BIN_SRC: ${{ matrix.bin_src }}
          BIN_NAME: ${{ matrix.bin_name }}
        run: |
          uv venv --clear --python 3.12
          PY_BIN="$(uv python find 3.12)"
          CARGO_TARGET_DIR="target" PYO3_PYTHON="$PY_BIN" cargo build \
            --manifest-path src/rs/Cargo.toml \
            --bin vertebra-server \
            --release \
            --features vertebra-http/python,vertebra-http/tls,vertebra-http/compression,vertebra-http/http3
          mkdir -p dist
          cp "$BIN_SRC" "dist/$BIN_NAME"

      - name: Upload Artifact
        uses: actions/upload-artifact@v7
        with:
          name: vertebra-${{ matrix.target }}
          path: dist/${{ matrix.bin_name }}
          retention-days: 7

      - name: Upload to Release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v3
        with:
          files: dist/${{ matrix.bin_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

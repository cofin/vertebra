[project]
site_name = "Vertebra"
site_description = "One runtime for Python and TypeScript — backend, frontend, web, gRPC, workers, and standalone apps."
site_url = "https://cofin.github.io/vertebra/"
repo_url = "https://github.com/cofin/vertebra"
repo_name = "cofin/vertebra"
docs_dir = "docs"
site_dir = "site"
use_directory_urls = true
exclude_docs = """
examples/*.py
"""
extra_css = ["stylesheets/extra.css"]
nav = [
  { "Home" = "index.md" },
  { "Getting Started" = [
    { "Overview" = "getting-started/index.md" },
    { "Installation" = "getting-started/installation.md" },
    { "Quickstart" = "getting-started/quickstart.md" },
    { "Configuration" = "getting-started/configuration.md" },
    { "CLI" = "getting-started/cli.md" },
    { "Examples" = "examples/index.md" },
    { "Changelog" = "changelog/index.md" },
  ] },
  { "Usage" = [
    { "Overview" = "usage/index.md" },
    { "Framework & Routing" = [
      { "Routing, Controllers & Procedures" = "usage/routing-and-handlers.md" },
      { "DI, Security & OpenAPI" = "usage/framework-features.md" },
      { "Queues, LiveState, Email & Telemetry" = "usage/queues-and-realtime.md" },
    ] },
    { "Server & Runtime" = [
      { "Server & Workers" = "usage/server-and-workers.md" },
      { "Packaging & Deployment" = "usage/packaging-and-deployment.md" },
      { "Testing" = "usage/testing.md" },
    ] },
    { "Databases" = [
      { "Overview & Drivers" = "usage/databases.md" },
      { "Cloud Dialers (Cloud SQL & AlloyDB)" = "usage/cloud-dialers.md" },
      { "RLS, CDC & Arrow Analytics" = "usage/analytics-and-cdc.md" },
      { "SQLSpec, SQLAlchemy & Extensions" = "usage/extensions.md" },
    ] },
    { "Object Storage" = [
      { "Overview & Backends" = "usage/storage.md" },
      { "GCS, Active ADC & Presigning" = "usage/storage-auth-and-signing.md" },
      { "Range Reads, Parquet & Attachments" = "usage/storage-parquet-and-orm.md" },
    ] },
    { "AI, Agents & Embeddings" = [
      { "MCP, Skills & Stdio Bridge" = "usage/agent-protocols.md" },
      { "A2A, WebMCP & Workflows" = "usage/a2a-and-workflows.md" },
      { "Vector Embeddings & Slabs" = "usage/embeddings-and-vectors.md" },
    ] },
    { "Frontend & Client SDK" = [
      { "Bundler, Inertia v3 & QuickJS SSR" = "usage/frontend-and-ssr.md" },
      { "TypeScript SDK & Framework Adapters" = "usage/typescript-sdk.md" },
    ] },
  ] },
  { "Architecture" = [
    { "Overview" = "architecture/index.md" },
    { "Runtime & Shared-Memory IPC" = "architecture/runtime-and-ipc.md" },
    { "HTTP/1.1, HTTP/2, HTTP/3 & gRPC Ingress" = "architecture/http-ingress.md" },
    { "PyO3 Bridge & Worker Lanes" = "architecture/pyo3-and-workers.md" },
    { "Bundler, QuickJS SSR & TypeScript SDK" = "architecture/bundler-and-client.md" },
  ] },
  { "Reference" = [
    { "Overview" = "reference/index.md" },
    { "Framework & Routing" = [
      { "vertebra" = "reference/vertebra.md" },
      { "Framework" = "reference/framework.md" },
      { "Task Queues" = "reference/queues.md" },
    ] },
    { "Server & Runtime" = [
      { "Server & Workers" = "reference/server.md" },
      { "Telemetry & Logging" = "reference/telemetry.md" },
      { "Build, Wasm & Supervisor" = "reference/build-and-wasm.md" },
      { "CLI Reference" = "reference/cli.md" },
    ] },
    { "Databases" = [
      { "Database Drivers & Pools" = "reference/db.md" },
      { "Database Capabilities" = "reference/database-capabilities.md" },
      { "SQLSpec, Alchemy & Extensions" = "reference/extensions.md" },
    ] },
    { "Object Storage" = [
      { "Object Storage" = "reference/storage.md" },
    ] },
    { "Frontend & Client SDK" = [
      { "Inertia, HTMX & SSR" = "reference/inertia.md" },
      { "@vertebra/client (TypeScript)" = "reference/typescript-client.md" },
    ] },
    { "Agents & Native SDKs" = [
      { "Agent Runtime (MCP & A2A)" = "reference/agent.md" },
      { "OKF & Knowledge Catalog" = "reference/okf-and-catalog.md" },
      { "PyO3 Native Stubs" = "reference/native-stubs.md" },
    ] },
  ] },
]

[project.theme]
variant = "modern"
language = "en"
logo = "assets/logo.svg"
favicon = "assets/favicon.svg"
features = [
  "content.code.annotate",
  "content.code.copy",
  "content.tabs.link",
  "navigation.path",
  "navigation.sections",
  "navigation.tabs",
  "navigation.top",
  "search.highlight",
  "toc.follow",
]

[project.theme.font]
text = "Inter"
code = "JetBrains Mono"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
primary = "custom"
accent = "indigo"
toggle = { icon = "lucide/sun", name = "Switch to dark mode" }

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
primary = "custom"
accent = "indigo"
toggle = { icon = "lucide/moon", name = "Switch to light mode" }

[project.extra]
generator = false

[project.plugins.search]

[project.plugins.redirects.redirect_maps]
"usage/query-pipelines.md" = "usage/databases.md"
"backpressure.md" = "architecture/http-ingress.md"
"parallelism.md" = "architecture/pyo3-and-workers.md"
"usage/databases-and-storage.md" = "usage/databases.md"

[project.plugins.mkdocstrings]
default_handler = "python"
custom_templates = "tools/docs/templates"
enable_inventory = true

[project.plugins.mkdocstrings.handlers.python]
paths = ["src/py"]
inventories = [
  "https://docs.python.org/3/objects.inv",
  "https://typing-extensions.readthedocs.io/en/stable/objects.inv",
  "https://click.palletsprojects.com/en/stable/objects.inv",
  "https://docs.litestar.dev/latest/objects.inv",
  "https://msgspec.dev/objects.inv",
  "https://docs.sqlalchemy.org/en/20/objects.inv",
  "https://advanced-alchemy.litestar.dev/latest/objects.inv",
  "https://sqlspec.dev/objects.inv",
]

[project.plugins.mkdocstrings.handlers.python.options]
docstring_style = "google"
docstring_section_style = "table"
find_stubs_package = true
heading_level = 3
inherited_members = false
line_length = 80
members_order = "source"
merge_init_into_class = false
modernize_annotations = true
annotations_path = "brief"
preload_modules = ["vertebra"]
separate_signature = true
show_bases = true
show_category_heading = false
show_if_no_docstring = true
show_labels = false
show_object_full_path = false
show_overloads = false
show_root_full_path = false
show_root_heading = true
show_root_toc_entry = true
show_signature_annotations = false
show_source = false
show_symbol_type_heading = true
show_symbol_type_toc = false
signature_crossrefs = true
summary = { attributes = true, functions = false, classes = false, modules = false }
unwrap_annotated = true
filters = ["!^_"]

[project.markdown_extensions]
admonition = {}
attr_list = {}
def_list = {}
footnotes = {}
md_in_html = {}
tables = {}
toc = { permalink = true, toc_depth = "2-3" }

[project.markdown_extensions.pymdownx.details]
[project.markdown_extensions.pymdownx.inlinehilite]
[project.markdown_extensions.pymdownx.keys]

[project.markdown_extensions.pymdownx.highlight]
anchor_linenums = true
line_spans = "__span"
pygments_lang_class = true

[project.markdown_extensions.pymdownx.snippets]
base_path = ["."]
check_paths = true
dedent_subsections = true

[project.markdown_extensions.pymdownx.superfences]
custom_fences = [
  { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" },
]

[project.markdown_extensions.pymdownx.tabbed]
alternate_style = true
slugify = { object = "pymdownx.slugs.slugify", kwds = { case = "lower" } }

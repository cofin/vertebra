default_language_version:
  python: "3"
repos:
  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v4.5.0
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-ast
      - id: check-case-conflict
      - id: check-toml
      - id: debug-statements
      - id: end-of-file-fixer
      - id: mixed-line-ending
      - id: trailing-whitespace
  - repo: https://github.com/charliermarsh/ruff-pre-commit
    rev: "v0.17.3"
    hooks:
      - id: ruff
        types_or: [python, pyi]
        args: [--fix]
      - id: ruff-format
        types_or: [python, pyi]
  - repo: https://github.com/codespell-project/codespell
    rev: v2.4.3
    hooks:
      - id: codespell
        exclude: "uv.lock|package.json|package-lock.json|bun.lock"
        additional_dependencies:
          - tomli
  - repo: https://github.com/sphinx-contrib/sphinx-lint
    rev: "v1.0.2"
    hooks:
      - id: sphinx-lint
  - repo: local
    hooks:
      - id: review-setup
        name: validate agentic review setup
        entry: uv run python -m tools.scripts.review_setup validate
        language: system
        pass_filenames: false
        files: ^(\.agents/|AGENTS\.md|docs/|tools/scripts/review_setup\.py|src/py/tests/unit/test_review_setup\.py)

syntax = "proto3";

package vertebra.asgi;

message Header {
  string name = 1;
  string value = 2;
}

message ASGIRequest {
  string type = 1;
  string http_version = 2;
  string method = 3;
  string path = 4;
  bytes raw_path = 5;
  bytes query_string = 6;
  repeated Header headers = 7;
  string scheme = 8;
  string server_host = 9;
  int32 server_port = 10;
  string client_host = 11;
  int32 client_port = 12;
  bytes body = 13;
  bool more_body = 14;
  string connection_id = 15;
}

message ASGIResponse {
  int32 status = 1;
  repeated Header headers = 2;
  bytes body = 3;
  bool more_body = 4;
}

message ASGIEvent {
  oneof payload {
    ASGIRequest request = 1;
    ASGIResponse response = 2;
  }
}

[package]
name = "vertebra-mysql"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Standalone PyO3 native extension for MySQL 8.4/9 and MariaDB wire protocol, Cloud SQL IAM/mTLS, and VTBARROW shared-memory cursors."

[lib]
name = "_mysql"
crate-type = ["cdylib", "rlib"]

[features]
default = []
extension-module = ["pyo3/extension-module"]

[dependencies]
arrow-array = { version = "=60.1.0", default-features = false }
arrow-buffer = { version = "=60.1.0", default-features = false }
arrow-ipc = { version = "=60.1.0", default-features = false }
arrow-schema = { version = "=60.1.0", default-features = false }
bytes = { workspace = true }
mysql_async = { version = "=0.37.1", default-features = false, features = ["default-rustls-ring"] }
pyo3 = { workspace = true }
rsa = { version = "0.9", features = ["pem", "sha2"] }
rustls = { workspace = true }
rustls-pemfile = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha1 = "0.10"
sha2 = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tokio-rustls = { workspace = true }
url = { workspace = true }
vertebra-core = { path = "../vertebra-core", default-features = false, features = ["gcp-auth"] }
vertebra-db = { path = "../vertebra-db", default-features = false, features = ["arrow-shm", "broker", "dialer", "pyo3", "rustls-ring"] }
webpki-root-certs = { workspace = true }

[build-dependencies]
pyo3-build-config = { workspace = true }

[dev-dependencies]
pyo3 = { workspace = true, features = ["auto-initialize"] }
rcgen = { workspace = true }
tokio = { workspace = true, features = ["test-util"] }

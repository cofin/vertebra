[package]
name = "vertebra-bundler"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Native OXC bundler integration for Vertebra"

[lib]
name = "_bundler"
crate-type = ["cdylib", "rlib"]

[features]
default = []
extension-module = ["pyo3/extension-module"]

[dependencies]
pyo3 = { workspace = true }

# oxc for parsing/transforming (Rolldown's foundation)
oxc_parser = "0.155"
oxc_span = "0.155"
oxc_allocator = "0.155"
oxc_codegen = "0.155"
oxc_transformer = "0.155"
oxc_semantic = "0.155"

# File watching for HMR
notify = { package = "rolldown-notify", version = "11.0", default-features = false, features = ["macos_kqueue"] }
notify-debouncer-mini = { package = "rolldown-notify-debouncer-mini", version = "0.9", default-features = false, features = ["macos_kqueue"] }

# QuickJS for SSR
rquickjs = { version = "0.14", features = ["bindgen", "classes", "properties", "parallel"] }

# Async runtime
tokio = { workspace = true }

# Serialization
serde = { workspace = true }
serde_json = { workspace = true }

# Utilities
thiserror = { workspace = true }
dashmap = "6"
crossbeam-queue = "0.3"

[build-dependencies]
pyo3-build-config = { workspace = true }

[dev-dependencies]
pyo3 = { workspace = true, features = ["auto-initialize"] }
tempfile = "3"

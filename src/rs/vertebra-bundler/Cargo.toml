[package]
name = "vertebra-bundler"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Native OXC bundler integration for Vertebra"

[lib]
name = "_bundler"
crate-type = ["cdylib", "rlib"]

[features]
default = []
extension-module = ["pyo3/extension-module"]

[dependencies]
pyo3 = { workspace = true }

# oxc for parsing/transforming (Rolldown's foundation)
oxc_allocator = "0.155"
oxc_ast = "0.155"
oxc_codegen = "0.155"
oxc_parser = "0.155"
oxc_semantic = "0.155"
oxc_span = "0.155"
oxc_transformer = "0.155"

# File watching for HMR
notify = { workspace = true }
notify-debouncer-mini = { workspace = true }

# QuickJS for SSR
rquickjs = { version = "0.14", features = ["classes", "properties", "parallel"] }

# Async runtime / channels
crossbeam-channel = { workspace = true }

# Utilities
thiserror = { workspace = true }

[build-dependencies]
pyo3-build-config = { workspace = true }

[dev-dependencies]
criterion = { workspace = true }
pyo3 = { workspace = true, features = ["auto-initialize"] }
tempfile = "3"

[[bench]]
name = "ssr_render"
harness = false

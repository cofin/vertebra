[package]
name = "vertebra-bundler"
version = "0.1.0"
edition = "2021"
description = "Native OXC bundler integration for Vertebra"
license = "MIT"

[lib]
name = "_bundler"
crate-type = ["cdylib", "rlib"]

[features]
default = []
extension-module = ["pyo3/extension-module"]

[dependencies]
pyo3 = { workspace = true }

# oxc for parsing/transforming (Rolldown's foundation)
oxc_parser = "0.112"
oxc_span = "0.112"
oxc_allocator = "0.112"
oxc_codegen = "0.112"
oxc_transformer = "0.112"
oxc_semantic = "0.112"

# File watching for HMR
notify = { package = "rolldown-notify", version = "10.1", default-features = false, features = ["macos_kqueue"] }
notify-debouncer-mini = { package = "rolldown-notify-debouncer-mini", version = "0.8", default-features = false, features = ["macos_kqueue"] }

# QuickJS for SSR (Task 9)
rquickjs = { version = "0.10", features = ["bindgen", "classes", "properties", "parallel"] }

# Async runtime
tokio = { version = "1", features = ["rt-multi-thread", "fs", "sync", "macros"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Utilities
thiserror = "2"
dashmap = "6"
crossbeam-queue = "0.3"

[dev-dependencies]
tempfile = "3"

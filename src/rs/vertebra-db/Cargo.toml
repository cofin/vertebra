[package]
name = "vertebra-db"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Native Rust database wire protocols, cloud dialers, and shared-memory Arrow/row framing for Vertebra"

[lib]
name = "vertebra_db"
crate-type = ["rlib"]

[dependencies]
vertebra-core = { path = "../vertebra-core" }
base64 = { workspace = true }
bytes = { workspace = true }
chrono = { workspace = true }
dashmap = { workspace = true }
futures = { workspace = true }
google-cloud-auth = { workspace = true, optional = true }
google-cloud-gax = { workspace = true, optional = true }
google-cloud-rpc = { workspace = true, optional = true }
google-cloud-wkt = { workspace = true, optional = true }
half = "=2.7.1"
hex = { workspace = true }
hmac = { workspace = true }
http = { workspace = true }
http-body-util = { workspace = true }
hyper = { workspace = true }
hyper-util = { workspace = true }
lz4_flex = { workspace = true }
pyo3 = { workspace = true, optional = true }
rcgen = { workspace = true }
reqwest = { workspace = true }
rmp-serde = { workspace = true }
rsa = { version = "0.9", features = ["sha2"] }
rustls = { workspace = true }
rustls-pemfile = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
socket2 = { version = "=0.6.5", features = ["all"] }
thiserror = { workspace = true }
tokio = { workspace = true }
tokio-rustls = { workspace = true }
url = { workspace = true }
webpki-root-certs = { workspace = true }
zstd = { workspace = true }

[build-dependencies]
pyo3-build-config = { workspace = true }

[dev-dependencies]
proptest = { workspace = true }
tempfile = "3"

[features]
default = []
duckdb = []
gcp = [
    "dep:google-cloud-auth",
    "dep:google-cloud-gax",
    "dep:google-cloud-rpc",
    "dep:google-cloud-wkt",
]
pyo3 = ["dep:pyo3"]

[[test]]
name = "gcp_credentials_tests"
required-features = ["gcp"]

[workspace]
resolver = "2"
members = [
    "vertebra-core",
    "vertebra-http",
    "vertebra-py",
    "vertebra-bundler",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Vertebra Contributors"]
license = "MIT"
repository = "https://github.com/vertebra-io/vertebra"

[workspace.dependencies]
# Shared dependency versions — pin here, reference with { workspace = true } in crates
arrow = "53.0"
criterion = { version = "0.5", features = ["async_tokio"] }
crossbeam-channel = "0.5"
crossbeam-utils = "0.8"
libc = "0.2"
proptest = "1.6"
rustix = "0.38"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tokio = { version = "1.35", features = ["full"] }
matchit = "0.7"
jsonwebtoken = "9.3"
lz4_flex = "0.11"
rmp-serde = "1.3"
zstd = "0.13"
pyo3 = { version = "0.28.2" }
windows-sys = { version = "0.52", features = ["Win32_System_Memory", "Win32_System_Threading"] }

[profile.release]
lto = true
codegen-units = 1
opt-level = 3

[workspace]
resolver = "2"
members = [
    "vertebra-core",
    "vertebra-http",
    "vertebra-py",
    "vertebra-bundler",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
authors = ["Vertebra Contributors"]
license = "MIT"
repository = "https://github.com/vertebra-io/vertebra"

[workspace.dependencies]
bytes = "1.12"
criterion = { version = "0.8", features = ["async_tokio"] }
crossbeam-channel = "0.5"
crossbeam-utils = "0.8"
libc = "0.2"
notify = { package = "rolldown-notify", version = "11.0" }
notify-debouncer-mini = { package = "rolldown-notify-debouncer-mini", version = "0.9" }
proptest = "1.12"
rustix = "1.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tokio = { version = "1.54", features = ["full"] }
matchit = "0.9"
mimalloc = { version = "0.1.52", default-features = false }
jsonwebtoken = { version = "11.1", features = ["rust_crypto"] }
lz4_flex = "0.14"
rmp-serde = "1.3"
zstd = "0.14"
pyo3 = { version = "0.30.1" }
pyo3-build-config = { version = "0.30.1", features = ["resolve-config"] }
quinn = { version = "0.11.9", default-features = false, features = ["runtime-tokio", "rustls", "ring"] }
h3 = "0.0.8"
h3-quinn = "0.0.10"
windows-sys = { version = "0.61", features = ["Win32_System_Memory", "Win32_System_Threading"] }

[profile.release]
lto = true
codegen-units = 1
opt-level = 3

[workspace]
resolver = "2"
members = [
    "vertebra-core",
    "vertebra-py",
    "vertebra-broker",
    "vertebra-server",
    "vertebra-engine",
]

[workspace.package]
version = "0.1.0"
authors = ["Cody Fincher <cody@litestar.dev>"]
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/litestar-org/vertebra"

[workspace.dependencies]
arrow = "53.0"
criterion = "0.5"
crossbeam-utils = "0.8"
libc = "0.2"
proptest = "1.6"
rustix = "0.38"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tokio = { version = "1.35", features = ["full"] }
matchit = "0.7"
jsonwebtoken = "9.3"
rmp-serde = "1.3"

pyo3 = { version = "0.27", features = ["extension-module"] }

windows-sys = { version = "0.52", features = ["Win32_System_Memory", "Win32_System_Threading"] }

[profile.release]
lto = true
codegen-units = 1
opt-level = 3

[workspace.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[workspace]
resolver = "2"
members = [
    "vertebra-core",
    "vertebra-http",
    "vertebra-py",
    "vertebra-bundler",
    "vertebra-storage",
    "vertebra-db",
    "vertebra-mysql",
    "vertebra-bigquery",
    "vertebra-mssql",
    "vertebra-spanner",
    "vertebra-duckdb",
    "vertebra-oracle",
    "vertebra-postgres",
    "vertebra-sqlite",
    "vertebra-redis",
    "vertebra-valkey",
]

[workspace.package]
version = "0.3.0"
edition = "2024"
authors = ["Vertebra Contributors"]
license = "MIT"
repository = "https://github.com/cofin/vertebra"

[workspace.dependencies]
arrow-array = { version = "=60.1.0", default-features = false }
arrow-buffer = { version = "=60.1.0", default-features = false }
arrow-ipc = { version = "=60.1.0", default-features = false }
arrow-schema = { version = "=60.1.0", default-features = false }
async-trait = "0.1"
base64 = "0.22"
bytes = "1.12"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
criterion = { version = "0.8", features = ["async_tokio"] }
crossbeam-channel = "0.5"
crossbeam-utils = "0.8"
dashmap = "6"
flate2 = "1.1"
futures = "0.3"
futures-util = "0.3"
getrandom = "0.3"
google-cloud-auth = { version = "1.18", default-features = false }
google-cloud-bigquery = { version = "=0.19.0", default-features = false }
google-cloud-gax = { version = "1.15", default-features = false }
google-cloud-longrunning = { version = "1.14", default-features = false }
google-cloud-rpc = { version = "1.6", default-features = false }
google-cloud-spanner = { version = "=0.34.8-preview", default-features = false }
google-cloud-spanner-admin-database-v1 = { version = "1.15", default-features = false }
google-cloud-wkt = { version = "1", default-features = false }
hex = "0.4"
hmac = "0.12"
http = "1.2"
http-body-util = "0.1"
hyper = { version = "1", features = ["full"] }
hyper-util = { version = "0.1", features = ["full"] }
libc = "0.2"
notify = { package = "rolldown-notify", version = "11.0" }
notify-debouncer-mini = { package = "rolldown-notify-debouncer-mini", version = "0.9" }
proptest = "1.12"
prost = "0.14"
prost-types = "0.14"
rcgen = "0.14"
reqwest = { version = "0.13", default-features = false, features = ["json", "stream", "rustls", "http2"] }
rustls = { version = "0.23", features = ["ring"] }
rustls-pemfile = "2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
thiserror = "2.0"
tiberius = { version = "=0.13.0", default-features = false, features = ["tds73", "rustls", "chrono"] }
tokio = { version = "1.54", features = ["full"] }
tokio-rustls = "0.26"
tokio-util = { version = "0.7", features = ["compat"] }
tonic = { version = "0.14", default-features = false, features = ["tls-ring", "tls-webpki-roots"] }
url = "2.5"
uuid = { version = "1.23", features = ["v4"] }
webpki-root-certs = "1"
matchit = "0.9"
mimalloc = { version = "0.1.52", default-features = false }
jsonwebtoken = { version = "11.1", features = ["rust_crypto"] }
lz4_flex = "0.14"
zstd = "0.14"
pyo3 = { version = "0.30.1" }
pyo3-build-config = { version = "0.30.1", features = ["resolve-config"] }
quinn = { version = "0.11.12", default-features = false, features = ["runtime-tokio", "rustls", "ring"] }
h3 = "0.0.8"
h3-quinn = "0.0.10"
windows-sys = { version = "0.61", features = ["Win32_Security", "Win32_System_Memory", "Win32_System_SystemInformation", "Win32_System_Threading"] }

[profile.dev.package.num-bigint-dig]
opt-level = 3

[profile.dev.package.rsa]
opt-level = 3

[profile.release]
lto = true
codegen-units = 1
opt-level = 3
panic = "unwind"

[package]
name = "vertebra-engine"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio = { workspace = true }
libc = { workspace = true }
thiserror = { workspace = true }
crossbeam-utils = { workspace = true }
pyo3 = { workspace = true, features = ["auto-initialize"] } # Auto-init for embedding

# Hyper stack (add to workspace later if needed, or inline here)
hyper = { version = "1.0", features = ["full"] }
hyper-util = { version = "0.1", features = ["full"] }
http-body-util = "0.1"
bytes = "1.0"

# Optional: PyO3 Asyncio
pyo3-async-runtimes = { version = "0.27", features = ["tokio-runtime"] }
windows-sys = { workspace = true }

[dev-dependencies]
# Test deps

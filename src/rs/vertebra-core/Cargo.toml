[package]
name = "vertebra-core"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Core IPC primitives and shared types for Vertebra"

[lib]
name = "vertebra_core"
crate-type = ["lib"]

[dependencies]
crossbeam-channel = { workspace = true }
crossbeam-utils = { workspace = true }
getrandom = { workspace = true }
hex = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, default-features = false, features = ["sync"] }
twox-hash = { version = "2.1", default-features = false, features = ["xxhash3_64"] }
bytes = { workspace = true }
chrono = { workspace = true, optional = true }
jsonwebtoken = { workspace = true }
lz4_flex = { workspace = true, optional = true }
reqwest = { workspace = true, optional = true }
url = { workspace = true, optional = true }
zstd = { workspace = true, optional = true }

[features]
default = ["compression", "gcp-auth"]
compression = ["dep:lz4_flex", "dep:zstd"]
gcp-auth = ["dep:reqwest", "dep:url", "dep:chrono", "tokio/process", "tokio/time"]
macos-ulock = []

[target.'cfg(unix)'.dependencies]
libc = { workspace = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true }

[dev-dependencies]
criterion = { workspace = true }
proptest = { workspace = true }
reqwest = { workspace = true }
tempfile = "3"
tokio = { workspace = true, features = ["rt", "macros", "time"] }

[[bench]]
name = "spsc"
harness = false

[[bench]]
name = "guards"
harness = false

[[bench]]
name = "ring_throughput"
harness = false

[[bench]]
name = "codec"
harness = false
required-features = ["compression"]

[[bench]]
name = "shm_transport"
harness = false

[package]
name = "vertebra-py"
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Python bindings for Vertebra (PyO3)"

[lib]
name = "_vertebra"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { workspace = true }
vertebra-core = { path = "../vertebra-core" }
vertebra-server = { path = "../vertebra-server" }
tokio = { workspace = true }
libc = { workspace = true }
rustix = { workspace = true, features = ["process", "fs", "system"] }
signal-hook = "0.3"
windows = { version = "0.52", features = ["Win32_System_JobObjects"] }

[package]
name = "vertebra-py"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "PyO3 bindings for Vertebra native extension"

[dependencies]
vertebra-core = { path = "../vertebra-core" }
vertebra-db = { path = "../vertebra-db", features = ["pyo3"] }
bytes = { workspace = true }
pyo3 = { workspace = true }
serde_json = { workspace = true }
jsonwebtoken = { workspace = true }
tokio = { workspace = true }

[target.'cfg(unix)'.dependencies]
libc = { workspace = true }

[build-dependencies]
pyo3-build-config = { workspace = true }

[dev-dependencies]
pyo3 = { workspace = true, features = ["auto-initialize"] }

[features]
default = []
gcp = ["vertebra-db/gcp"]
# Use "extension-module" when building as a standalone .so (maturin develop).
# Omit this feature when linking as rlib into the server binary.
extension-module = ["pyo3/extension-module"]

[lib]
name = "_vertebra"
crate-type = ["cdylib", "rlib"]

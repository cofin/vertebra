[package]
name = "vertebra-http"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Native HTTP server, router, and batch collector for Vertebra"

[[bin]]
name = "vertebra-server"
path = "src/main.rs"

[dependencies]
vertebra-core = { path = "../vertebra-core" }
_vertebra = { path = "../vertebra-py", package = "vertebra-py", optional = true }

# HTTP stack
hyper          = { version = "1", features = ["full"] }
hyper-util     = { version = "0.1", features = ["full"] }
http           = "1"
http-body-util = "0.1"

# Async runtime
tokio = { workspace = true }

# Routing
matchit = { workspace = true }
futures-util = "0.3"
tokio-tungstenite = "0.30"

# TLS (optional feature)
rustls          = { version = "0.23", optional = true, features = ["ring"] }
tokio-rustls    = { version = "0.26", optional = true }
rustls-pemfile  = { version = "2", optional = true }
quinn           = { workspace = true, optional = true }
h3              = { workspace = true, optional = true }
h3-quinn        = { workspace = true, optional = true }

# Python embedding (for server binary — needs auto-initialize, NOT extension-module)
pyo3 = { workspace = true, features = ["auto-initialize"], optional = true }

# Serialization (for AssetManager manifest)
serde       = { workspace = true }
serde_json  = { workspace = true }
zstd        = { workspace = true }

# Platform
libc = { workspace = true }
tokio-util = { version = "0.7", features = ["rt"] }

# Utilities
brotli     = "7.0"
flate2     = "1.1"
multer     = "3.1.0"
thiserror  = { workspace = true }
tracing    = "0.1"
fnv        = "1.0"
bytes      = { workspace = true }
dashmap    = "6"
mimalloc   = { workspace = true, optional = true }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[features]
default = ["python", "mimalloc"]
python = ["dep:pyo3", "dep:_vertebra"]
mimalloc = ["dep:mimalloc"]
tls = ["dep:rustls", "dep:tokio-rustls", "dep:rustls-pemfile"]
compression = ["vertebra-core/compression"]
http3 = ["tls", "dep:quinn", "dep:h3", "dep:h3-quinn"]

[build-dependencies]
pyo3-build-config = { workspace = true }

[dev-dependencies]
tokio-test     = "0.4"
criterion      = { workspace = true }
reqwest        = { version = "0.13", features = ["json", "http2", "blocking"] }
tempfile       = "3"
rustls-pemfile = "2"
rcgen          = "0.14"
serde_json     = { workspace = true }

[[bench]]
name = "server_throughput"
harness = false

[lib]
name = "vertebra_http"
crate-type = ["lib"]

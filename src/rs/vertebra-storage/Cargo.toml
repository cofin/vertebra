[package]
name = "vertebra-storage"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Multi-backend cloud object storage and V4 presigning for Vertebra"

[lib]
name = "_storage"
crate-type = ["cdylib", "rlib"]

[features]
default = []
extension-module = ["pyo3/extension-module"]

[dependencies]
async-trait = { workspace = true }
base64 = { workspace = true }
bytes.workspace = true
chrono = { workspace = true }
futures = { workspace = true }
hex = { workspace = true }
hmac = { workspace = true }
http = { workspace = true }
object_store = { version = "0.13.2", features = ["aws", "gcp", "azure", "http"] }
pyo3 = { workspace = true }
quick-xml = { version = "0.39.4", features = ["serialize"] }
reqwest = { workspace = true }
rsa = { version = "0.9", features = ["sha2"] }
serde.workspace = true
serde_json.workspace = true
sha2 = { workspace = true }
thiserror.workspace = true
tokio.workspace = true
url = { workspace = true }
uuid = { version = "=1.29.1", features = ["v4"] }
vertebra-core = { path = "../vertebra-core" }

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = ["Win32_Foundation", "Win32_Storage_FileSystem"] }

[build-dependencies]
pyo3-build-config = { workspace = true }

[dev-dependencies]
pyo3 = { workspace = true, features = ["auto-initialize"] }
tempfile = "3.15"

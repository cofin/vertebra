[package]
name = "vertebra-redis"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Standalone PyO3 native extension for Redis 7.2+/8.0 wire protocol, Sentinel, Cluster, CLIENT TRACKING, Streams, and Memorystore IAM."

[lib]
name = "_redis"
crate-type = ["cdylib", "rlib"]

[features]
default = []
extension-module = ["pyo3/extension-module"]

[dependencies]
bytes = { workspace = true }
parking_lot = "0.12"
pyo3 = { workspace = true }
tokio = { workspace = true }
vertebra-db = { path = "../vertebra-db", default-features = false, features = ["pyo3", "rustls-ring"] }
vertebra-resp = { path = "../vertebra-resp", features = ["pyo3"] }

[build-dependencies]
pyo3-build-config = { workspace = true }

[dev-dependencies]
pyo3 = { workspace = true, features = ["auto-initialize"] }
tokio = { workspace = true, features = ["test-util"] }

[package]
name = "vertebra-redis"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Standalone PyO3 native extension for Redis 7.2+/8.0 wire protocol, Sentinel, Cluster, CLIENT TRACKING, Streams, and Memorystore IAM."

[lib]
name = "_redis"
crate-type = ["cdylib", "rlib"]

[features]
default = []
extension-module = ["pyo3/extension-module"]

[dependencies]
bytes = { workspace = true }
futures-util = "0.3"
lru = "0.16"
parking_lot = "0.12"
pyo3 = { workspace = true }
redis = { version = "=1.8.2", default-features = false, features = ["tokio-comp", "tokio-rustls-comp", "cluster-async", "connection-manager", "cache-aio", "streams", "script", "acl", "sentinel"] }
rustls = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
url = { workspace = true }
vertebra-core = { path = "../vertebra-core" }
vertebra-db = { path = "../vertebra-db", features = ["gcp", "pyo3"] }

[build-dependencies]
pyo3-build-config = { workspace = true }

[dev-dependencies]
pyo3 = { workspace = true, features = ["auto-initialize"] }
tokio = { workspace = true, features = ["test-util"] }

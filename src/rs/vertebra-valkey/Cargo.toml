[package]
name = "vertebra-valkey"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Native pure-Rust Valkey 8.0+/9.0 client, Cluster, Sentinel, Pub/Sub, Streams, and Memorystore IAM extension for Vertebra"

[lib]
name = "_valkey"
crate-type = ["cdylib", "rlib"]

[features]
default = []
extension-module = ["pyo3/extension-module"]

[dependencies]
bytes = { workspace = true }
pyo3 = { workspace = true }
tokio = { workspace = true }
vertebra-db = { path = "../vertebra-db", default-features = false, features = ["pyo3"] }
vertebra-resp = { path = "../vertebra-resp", features = ["pyo3"] }

[build-dependencies]
pyo3-build-config = { workspace = true }

[dev-dependencies]
parking_lot = "0.12"
rustls = { workspace = true }
rustls-pemfile = { workspace = true }
tokio-rustls = { workspace = true }
vertebra-core = { path = "../vertebra-core", default-features = false, features = ["gcp-auth"] }

[package]
name = "vertebra-valkey"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Native pure-Rust Valkey 8.0+/9.0 client, Cluster, Sentinel, Pub/Sub, Streams, and Memorystore IAM extension for Vertebra"

[lib]
name = "_valkey"
crate-type = ["cdylib", "rlib"]

[features]
default = []
extension-module = ["pyo3/extension-module"]

[dependencies]
bytes = { workspace = true }
lru = "0.16"
parking_lot = "0.12"
pyo3 = { workspace = true }
rustls = { workspace = true }
rustls-pemfile = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tokio-rustls = { workspace = true }
url = { workspace = true }
vertebra-core = { path = "../vertebra-core" }
vertebra-db = { path = "../vertebra-db", features = ["pyo3"] }
webpki-root-certs = { workspace = true }

[build-dependencies]
pyo3-build-config = { workspace = true }

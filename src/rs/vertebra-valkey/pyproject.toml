[build-system]
requires = ["maturin>=1.5,<2"]
build-backend = "maturin"

[project]
name = "vertebra-valkey"
version = "0.3.0"
description = "Native pure-Rust Valkey 8.0+/9.0 client, Cluster, Sentinel, Pub/Sub, Streams, and Memorystore IAM extension for Vertebra."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = ["vertebra-core==0.3.0"]
classifiers = [
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Rust",
    "Topic :: Database",
    "Typing :: Typed",
]

[project.urls]
Homepage = "https://cofin.github.io/vertebra/"
Documentation = "https://cofin.github.io/vertebra/"
Source = "https://github.com/cofin/vertebra/tree/main/src/rs/vertebra-valkey"
Issues = "https://github.com/cofin/vertebra/issues"
Changelog = "https://cofin.github.io/vertebra/changelog/"

[tool.maturin]
python-source = "../../py"
module-name = "vertebra._valkey"
features = ["extension-module"]
include = [
    { path = "vertebra/_valkey.pyi", format = ["sdist", "wheel"] },
]
exclude = [
    "**/py/vertebra/**/*.py",
    "**/py/vertebra/**/*.so",
    "**/py/vertebra/py.typed",
    "**/py/vertebra/_bigquery.pyi",
    "**/py/vertebra/_bundler.pyi",
    "**/py/vertebra/_duckdb.pyi",
    "**/py/vertebra/_mssql.pyi",
    "**/py/vertebra/_mysql.pyi",
    "**/py/vertebra/_oracle.pyi",
    "**/py/vertebra/_postgres.pyi",
    "**/py/vertebra/_redis.pyi",
    "**/py/vertebra/_spanner.pyi",
    "**/py/vertebra/_sqlite.pyi",
    "**/py/vertebra/_storage.pyi",
    "**/py/vertebra/_vertebra.pyi",
]

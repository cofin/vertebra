[build-system]
requires = ["maturin>=1.5,<2"]
build-backend = "maturin"

[project]
name = "vertebra-bigquery"
version = "0.3.0"
requires-python = ">=3.12"

[tool.maturin]
python-source = "../../py"
module-name = "vertebra._bigquery"
features = ["extension-module"]
include = ["vertebra/_bigquery.pyi"]
exclude = ["**/py/vertebra/**", "!**/py/vertebra/_bigquery.pyi"]

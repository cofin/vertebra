[project]
name = "vertebra-wasm"
version = "0.1.0"
description = "Vertebra WASM SDK for Pyodide"
requires-python = ">=3.12"
dependencies = [
    "msgspec>=0.18.0",
    "nanoarrow>=0.4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["vertebra_wasm"]

  <path d="M 682 196 L 718 196" fill="none" stroke="#86efac" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-green)"/>
  <rect x="722" y="152" width="118" height="88" rx="9" fill="#f0fdf4" stroke="#86efac" stroke-width="1.25"/>

  <rect x="20" y="112" width="186" height="62" rx="9" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.25"/>
  <text x="113.0" y="139.3" text-anchor="middle" class="sans title" fill="#0f172a">Worker Process 2</text>
  <text x="113.0" y="157.9" text-anchor="middle" class="sans sub" fill="#475569">SQLSpec / SQLAlchemy</text>

  <path d="M 218 300 L 218 320" fill="none" stroke="#64748b" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-muted)"/>
  <rect x="42" y="324" width="352" height="54" rx="9" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.25"/>

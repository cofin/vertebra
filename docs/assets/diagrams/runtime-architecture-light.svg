  <text x="218.0" y="364.0" text-anchor="middle" class="sans sub" fill="#475569">Default for 1 worker or free-threaded Python</text>
  <rect x="444" y="220" width="396" height="174" rx="12" fill="#f8fafc" stroke="#f59e0b" stroke-width="1.25" stroke-dasharray="5 4"/>

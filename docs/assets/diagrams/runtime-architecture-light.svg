  <text x="520.0" y="364.0" text-anchor="middle" class="sans sub" fill="#475569">Python proc</text>
  <rect x="588" y="324" width="108" height="54" rx="9" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.25"/>
  <text x="642.0" y="347.8" text-anchor="middle" class="sans title" fill="#0f172a">Worker 2</text>
  <text x="642.0" y="364.0" text-anchor="middle" class="sans sub" fill="#475569">Python proc</text>
  <rect x="710" y="324" width="108" height="54" rx="9" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.25"/>
  <text x="764.0" y="347.8" text-anchor="middle" class="sans title" fill="#0f172a">Worker N</text>
  <text x="764.0" y="364.0" text-anchor="middle" class="sans sub" fill="#475569">Python proc</text>

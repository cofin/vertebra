<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 294" width="860" height="294" role="img" aria-label="Cloud SQL and AlloyDB Direct Dialer">
  <title>Cloud SQL and AlloyDB Direct Dialer</title>
  <defs>
    <marker id="arrow-muted" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1.5 L 9 5 L 1 8.5 z" fill="#64748b"/></marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1.5 L 9 5 L 1 8.5 z" fill="#93c5fd"/></marker>
    <marker id="arrow-gold" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1.5 L 9 5 L 1 8.5 z" fill="#f59e0b"/></marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1.5 L 9 5 L 1 8.5 z" fill="#86efac"/></marker>
    <marker id="arrow-rose" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1.5 L 9 5 L 1 8.5 z" fill="#fda4af"/></marker>
  </defs>
  <style>
    .sans { font-family: Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    .mono { font-family: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
    .title { font-size: 13.5px; font-weight: 600; }
    .title-lg { font-size: 14.5px; font-weight: 600; }
    .sub { font-size: 11px; font-weight: 400; }
    .kicker { font-size: 10px; font-weight: 700; letter-spacing: 0.08em; }
    .label { font-size: 11px; font-weight: 500; }
    .caption { font-size: 11.5px; font-weight: 400; }
  </style>
  <rect x="20" y="24" width="262" height="246" rx="12" fill="#f8fafc" stroke="#93c5fd" stroke-width="1.25" stroke-dasharray="5 4"/>
  <text x="36" y="46" class="sans kicker" fill="#1d4ed8">VERTEBRA WORKER</text>
  <text x="266" y="46" text-anchor="end" class="sans sub" fill="#475569">In-process</text>
  <rect x="40" y="62" width="222" height="74" rx="9" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.25"/>
  <text x="151.0" y="94.6" text-anchor="middle" class="sans title" fill="#b45309">GCP Token Cache</text>
  <text x="151.0" y="116.8" text-anchor="middle" class="sans sub" fill="#475569">ADC + background refresh</text>
  <path d="M 151 136 L 151 172" fill="none" stroke="#64748b" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-muted)"/>
  <text x="161" y="158" class="sans sub" fill="#475569">cert + IAM token</text>
  <rect x="40" y="176" width="222" height="74" rx="9" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.25"/>
  <text x="151.0" y="208.6" text-anchor="middle" class="sans title" fill="#1d4ed8">Rust mTLS Dialer</text>
  <text x="151.0" y="230.8" text-anchor="middle" class="sans sub" fill="#475569">TLS 1.3 + IAM auth</text>
  <rect x="548" y="46" width="292" height="92" rx="9" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.25"/>
  <rect x="719" y="56" width="109" height="18" rx="9" fill="#f1f5f9"/>
  <text x="773.5" y="68.5" text-anchor="middle" class="sans kicker" fill="#b45309">CONTROL PLANE</text>
  <text x="694.0" y="97.5" text-anchor="middle" class="sans title" fill="#b45309">Cloud SQL / AlloyDB API</text>
  <text x="694.0" y="121.4" text-anchor="middle" class="sans sub" fill="#475569">Issues ephemeral X.509 client cert</text>
  <rect x="548" y="166" width="292" height="92" rx="9" fill="#f0fdf4" stroke="#86efac" stroke-width="1.25"/>
  <rect x="740" y="176" width="88" height="18" rx="9" fill="#f1f5f9"/>
  <text x="784.0" y="188.5" text-anchor="middle" class="sans kicker" fill="#15803d">DATA PLANE</text>
  <text x="694.0" y="217.5" text-anchor="middle" class="sans title" fill="#15803d">Cloud SQL / AlloyDB Instance</text>
  <text x="694.0" y="241.4" text-anchor="middle" class="sans sub" fill="#475569">Direct mTLS on :3307 or :5433</text>
  <path d="M 266 96 L 544 96" fill="none" stroke="#f59e0b" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="5 4" marker-start="url(#arrow-gold)" marker-end="url(#arrow-gold)"/>
  <text x="405" y="84" text-anchor="middle" class="sans label" fill="#b45309">1. Fetch ephemeral cert (cached)</text>
  <path d="M 262 213 L 544 213" fill="none" stroke="#86efac" stroke-width="2.0" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-green)"/>
  <text x="405" y="201" text-anchor="middle" class="sans label" fill="#15803d">2. Direct mTLS connection</text>
  <rect x="327.8" y="226.0" width="154.5" height="20" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
  <text x="405.0" y="239.8" text-anchor="middle" class="sans label" fill="#475569">No Auth Proxy sidecar</text>
</svg>
